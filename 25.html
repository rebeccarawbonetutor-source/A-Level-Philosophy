<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>25 mark essay planning</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #94a3b8;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent-primary: #0369a1;
            --accent-header: #075985;
            --hover-bg: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            padding: 2.5rem 1rem 1.5rem;
            text-align: center;
            border-bottom: 1px solid #cbd5e1;
            background: #ffffff;
            position: relative;
        }

        .nav-container {
            position: absolute;
            top: 1.5rem;
            left: 2rem;
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background-color: #ffffff;
            color: var(--accent-header);
            border: 1px solid var(--card-border);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .nav-btn:hover {
            background-color: var(--hover-bg);
            border-color: var(--accent-primary);
        }

        header h1 {
            font-size: 2.4rem;
            color: var(--accent-header);
            font-weight: 700;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 3rem;
            flex: 1;
            width: 100%;
        }

        .planner-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-top: 5px solid var(--accent-primary);
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
            position: relative;
        }

        .planner-header {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--accent-header);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input, .input-group select {
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text-main);
            background-color: #f8fafc;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: var(--accent-primary);
            background-color: #ffffff;
        }

        .section-header {
            font-size: 1.2rem;
            color: var(--accent-header);
            margin: 1.8rem 0 1rem 0;
            font-weight: 700;
            border-bottom: 2px solid var(--accent-primary);
            padding-bottom: 0.4rem;
        }

        .subsection-title {
            font-size: 1rem;
            color: var(--accent-header);
            margin: 1.2rem 0 0.5rem 0;
            font-weight: 600;
        }

        .textarea-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-bottom: 1rem;
        }

        .textarea-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .textarea-group textarea {
            width: 100%;
            height: 90px;
            padding: 0.75rem;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-main);
            background-color: #f8fafc;
            resize: vertical;
        }

        .textarea-group textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            background-color: #ffffff;
        }

        .thread-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .thread-grid textarea {
            height: 140px;
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #e2e8f0;
        }

        .action-btn {
            background-color: var(--accent-primary);
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .action-btn:hover {
            background-color: var(--accent-header);
        }

        .action-btn.secondary {
            background-color: #ffffff;
            color: var(--accent-header);
            border: 2px solid var(--accent-primary);
        }

        .action-btn.secondary:hover {
            background-color: var(--hover-bg);
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid #cbd5e1;
            background: #ffffff;
        }

        /* Print styles */
        @media print {
            body {
                background-color: #ffffff;
            }
            .nav-container, .global-actions, footer, .print-hide, .actions-bar {
                display: none !important;
            }
            .planner-card {
                box-shadow: none;
                border: none;
                page-break-after: always;
                margin-bottom: 0;
                padding: 0;
            }
            body.print-single .planner-card:not(.active-print) {
                display: none !important;
            }
            body.print-single .planner-card.active-print {
                display: block !important;
                page-break-after: avoid;
            }
            .container {
                padding: 0;
                max-width: 100%;
                gap: 0;
            }
            header {
                display: none;
            }
            input, select, textarea {
                border: 1px solid #94a3b8 !important;
                background-color: transparent !important;
                resize: none;
            }
            .thread-grid {
                background-color: transparent !important;
                border: 1px solid #94a3b8 !important;
            }
        }

        @media (max-width: 768px) {
            .planner-header {
                grid-template-columns: 1fr;
            }
            .thread-grid {
                grid-template-columns: 1fr;
            }
            .thread-grid textarea {
                height: 100px;
            }
        }
    </style>
</head>
<body>

    <header class="print-hide">
        <div class="nav-container">
            <a href="index.html" class="nav-btn">🏠 Home</a>
        </div>
        <h1>25 mark essay planning</h1>
    </header>

    <div class="container" id="planner-container">
        
        <!-- Planner Template 1 -->
        <div class="planner-card" id="card-1">
            <div class="planner-header">
                <div class="input-group">
                    <label>Essay Title / Question</label>
                    <input type="text" placeholder="Enter essay question...">
                </div>
                <div class="input-group">
                    <label>Topic / Module</label>
                    <select>
                        <option value="">Select topic...</option>
                        <option value="epistemology">Epistemology</option>
                        <option value="moral">Moral Philosophy</option>
                        <option value="god">Metaphysics of God</option>
                        <option value="mind">Metaphysics of the Mind</option>
                    </select>
                </div>
            </div>

            <!-- Introduction Section -->
            <div class="section-header">Introduction</div>
            <div class="textarea-group">
                <label>Outline the issue (AO1):</label>
                <textarea placeholder="Outline the core philosophical problem and define key terms..."></textarea>
            </div>
            <div class="textarea-group">
                <label>Statement of intent:</label>
                <textarea placeholder="State what you intend to argue..."></textarea>
            </div>
            <div class="textarea-group">
                <label>Promise of weighting and balance:</label>
                <textarea placeholder="Outline the direction of the debate and how the arguments will be weighed..."></textarea>
            </div>

            <!-- Main Body Section -->
            <div class="section-header">Main Body</div>

            <div class="subsection-title">Thread 1</div>
            <div class="thread-grid">
                <div class="textarea-group" style="margin-bottom:0;">
                    <label>Argument 1</label>
                    <textarea placeholder="Point, evidence, and philosopher..."></textarea>
                </div>
                <div class="textarea-group" style="margin-bottom:0;">
                    <label>But 1</label>
                    <textarea placeholder="Objection or counter-argument..."></textarea>
                </div>
                <div class="textarea-group" style="margin-bottom:0;">
                    <label>Conclusion 1</label>
                    <textarea placeholder="Mini-judgment on this thread..."></textarea>
                </div>
            </div>

            <div class="subsection-title">Thread 2</div>
            <div class="thread-grid">
                <div class="textarea-group" style="margin-bottom:0;">
                    <label>Argument 2</label>
                    <textarea placeholder="Point, evidence, and philosopher..."></textarea>
                </div>
                <div class="textarea-group" style="margin-bottom:0;">
                    <label>But 2</label>
                    <textarea placeholder="Objection or counter-argument..."></textarea>
                </div>
                <div class="textarea-group" style="margin-bottom:0;">
                    <label>Conclusion 2</label>
                    <textarea placeholder="Mini-judgment on this thread..."></textarea>
                </div>
            </div>

            <div class="subsection-title">Thread 3</div>
            <div class="thread-grid">
                <div class="textarea-group" style="margin-bottom:0;">
                    <label>Argument 3</label>
                    <textarea placeholder="Point, evidence, and philosopher..."></textarea>
                </div>
                <div class="textarea-group" style="margin-bottom:0;">
                    <label>But 3</label>
                    <textarea placeholder="Objection or counter-argument..."></textarea>
                </div>
                <div class="textarea-group" style="margin-bottom:0;">
                    <label>Conclusion 3</label>
                    <textarea placeholder="Mini-judgment on this thread..."></textarea>
                </div>
            </div>

            <div class="subsection-title">Thread 4</div>
            <div class="thread-grid">
                <div class="textarea-group" style="margin-bottom:0;">
                    <label>Argument 4</label>
                    <textarea placeholder="Point, evidence, and philosopher..."></textarea>
                </div>
                <div class="textarea-group" style="margin-bottom:0;">
                    <label>But 4</label>
                    <textarea placeholder="Objection or counter-argument..."></textarea>
                </div>
                <div class="textarea-group" style="margin-bottom:0;">
                    <label>Conclusion 4</label>
                    <textarea placeholder="Mini-judgment on this thread..."></textarea>
                </div>
            </div>

            <!-- Conclusion Section -->
            <div class="section-header">Conclusion</div>
            <div class="textarea-group">
                <label>Final argument / synthesis:</label>
                <textarea placeholder="Synthesise the threads, weigh the competing arguments, and deliver your final reasoned verdict..."></textarea>
            </div>
            
            <div class="actions-bar print-hide">
                <button class="action-btn secondary" onclick="printSingleCard('card-1')">🖨️ Print this plan</button>
                <button class="action-btn secondary" style="color: #b91c1c; border-color: #f87171;" onclick="removeCard('card-1')">Remove plan</button>
            </div>
        </div>

    </div>

    <!-- Global Actions Bar -->
    <div style="text-align: center; margin-bottom: 4rem;" class="global-actions print-hide">
        <button class="action-btn secondary" onclick="addPlannerCard()" style="margin-right: 10px;">+ Add another essay plan</button>
        <button class="action-btn" onclick="printAllCards()">🖨️ Print all essay plans</button>
    </div>

    <footer class="print-hide">
        25 mark essay planning &bull; Designed for teaching and revision
    </footer>

    <script>
        let cardCount = 1;

        function addPlannerCard() {
            cardCount++;
            const newId = 'card-' + cardCount;
            const container = document.getElementById('planner-container');

            const cardHTML = `
            <div class="planner-card" id="${newId}">
                <div class="planner-header">
                    <div class="input-group">
                        <label>Essay Title / Question</label>
                        <input type="text" placeholder="Enter essay question...">
                    </div>
                    <div class="input-group">
                        <label>Topic / Module</label>
                        <select>
                            <option value="">Select topic...</option>
                            <option value="epistemology">Epistemology</option>
                            <option value="moral">Moral Philosophy</option>
                            <option value="god">Metaphysics of God</option>
                            <option value="mind">Metaphysics of the Mind</option>
                        </select>
                    </div>
                </div>

                <div class="section-header">Introduction</div>
                <div class="textarea-group">
                    <label>Outline the issue (AO1):</label>
                    <textarea placeholder="Outline the core philosophical problem and define key terms..."></textarea>
                </div>
                <div class="textarea-group">
                    <label>Statement of intent:</label>
                    <textarea placeholder="State what you intend to argue..."></textarea>
                </div>
                <div class="textarea-group">
                    <label>Promise of weighting and balance:</label>
                    <textarea placeholder="Outline the direction of the debate and how the arguments will be weighed..."></textarea>
                </div>

                <div class="section-header">Main Body</div>

                <div class="subsection-title">Thread 1</div>
                <div class="thread-grid">
                    <div class="textarea-group" style="margin-bottom:0;">
                        <label>Argument 1</label>
                        <textarea placeholder="Point, evidence, and philosopher..."></textarea>
                    </div>
                    <div class="textarea-group" style="margin-bottom:0;">
                        <label>But 1</label>
                        <textarea placeholder="Objection or counter-argument..."></textarea>
                    </div>
                    <div class="textarea-group" style="margin-bottom:0;">
                        <label>Conclusion 1</label>
                        <textarea placeholder="Mini-judgment on this thread..."></textarea>
                    </div>
                </div>

                <div class="subsection-title">Thread 2</div>
                <div class="thread-grid">
                    <div class="textarea-group" style="margin-bottom:0;">
                        <label>Argument 2</label>
                        <textarea placeholder="Point, evidence, and philosopher..."></textarea>
                    </div>
                    <div class="textarea-group" style="margin-bottom:0;">
                        <label>But 2</label>
                        <textarea placeholder="Objection or counter-argument..."></textarea>
                    </div>
                    <div class="textarea-group" style="margin-bottom:0;">
                        <label>Conclusion 2</label>
                        <textarea placeholder="Mini-judgment on this thread..."></textarea>
                    </div>
                </div>

                <div class="subsection-title">Thread 3</div>
                <div class="thread-grid">
                    <div class="textarea-group" style="margin-bottom:0;">
                        <label>Argument 3</label>
                        <textarea placeholder="Point, evidence, and philosopher..."></textarea>
                    </div>
                    <div class="textarea-group" style="margin-bottom:0;">
                        <label>But 3</label>
                        <textarea placeholder="Objection or counter-argument..."></textarea>
                    </div>
                    <div class="textarea-group" style="margin-bottom:0;">
                        <label>Conclusion 3</label>
                        <textarea placeholder="Mini-judgment on this thread..."></textarea>
                    </div>
                </div>

                <div class="subsection-title">Thread 4</div>
                <div class="thread-grid">
                    <div class="textarea-group" style="margin-bottom:0;">
                        <label>Argument 4</label>
                        <textarea placeholder="Point, evidence, and philosopher..."></textarea>
                    </div>
                    <div class="textarea-group" style="margin-bottom:0;">
                        <label>But 4</label>
                        <textarea placeholder="Objection or counter-argument..."></textarea>
                    </div>
                    <div class="textarea-group" style="margin-bottom:0;">
                        <label>Conclusion 4</label>
                        <textarea placeholder="Mini-judgment on this thread..."></textarea>
                    </div>
                </div>

                <div class="section-header">Conclusion</div>
                <div class="textarea-group">
                    <label>Final argument / synthesis:</label>
                    <textarea placeholder="Synthesise the threads, weigh the competing arguments, and deliver your final reasoned verdict..."></textarea>
                </div>
                
                <div class="actions-bar print-hide">
                    <button class="action-btn secondary" onclick="printSingleCard('${newId}')">🖨️ Print this plan</button>
                    <button class="action-btn secondary" style="color: #b91c1c; border-color: #f87171;" onclick="removeCard('${newId}')">Remove plan</button>
                </div>
            </div>`;

            container.insertAdjacentHTML('beforeend', cardHTML);
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function removeCard(cardId) {
            const card = document.getElementById(cardId);
            const allCards = document.querySelectorAll('.planner-card');
            if (allCards.length > 1) {
                card.remove();
            } else {
                alert("You need to keep at least one essay plan template on the page.");
            }
        }

        function printSingleCard(cardId) {
            document.body.classList.add('print-single');
            document.querySelectorAll('.planner-card').forEach(card => {
                card.classList.remove('active-print');
            });
            document.getElementById(cardId).classList.add('active-print');
            window.print();
            document.body.classList.remove('print-single');
            document.getElementById(cardId).classList.remove('active-print');
        }

        function printAllCards() {
            document.body.classList.remove('print-single');
            window.print();
        }
    </script>
</body>
</html>
