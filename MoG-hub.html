<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 4: Arguments for the Existence of God</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #94a3b8;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent-primary: #0369a1;
            --accent-header: #075985;
            --hover-bg: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: auto;
        }

        header {
            padding: 1.5rem 1rem 1rem;
            text-align: center;
            border-bottom: 1px solid #cbd5e1;
            background: #ffffff;
            position: relative;
        }

        .nav-container {
            position: absolute;
            top: 1.5rem;
            left: 2rem;
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background-color: #ffffff;
            color: var(--accent-header);
            border: 1px solid var(--card-border);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .nav-btn:hover {
            background-color: var(--hover-bg);
            border-color: var(--accent-primary);
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--accent-header);
            font-weight: 700;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 4rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            width: 100%;
        }

        .overview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3rem;
            width: 100%;
            max-width: 1400px;
        }

        .overview-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-left: 6px solid var(--accent-primary);
            border-radius: 12px;
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 2.5rem;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .overview-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(3, 105, 161, 0.15), 0 8px 10px -6px rgba(3, 105, 161, 0.1);
        }

        .overview-card h2 {
            font-size: 1.6rem;
            color: var(--accent-header);
            font-weight: 700;
            line-height: 1.3;
        }

        .card-btn {
            margin-top: auto;
            background-color: var(--accent-primary);
            color: #ffffff;
            padding: 0.8rem 1.8rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            text-align: center;
            transition: background-color 0.2s ease;
        }

        .overview-card:hover .card-btn {
            background-color: var(--accent-header);
        }

        @media (max-width: 1024px) {
            .overview-grid {
                grid-template-columns: 1fr;
                max-width: 600px;
            }
        }

        @media (max-width: 768px) {
            .nav-container {
                position: static;
                justify-content: center;
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="nav-btn">🏠 Home</a>
            <a href="MoG-hub.html" class="nav-btn">← Back</a>
        </div>
        <h1>Unit 4: Arguments for the Existence of God</h1>
    </header>

    <div class="container">
        <div class="overview-grid">
            <a href="ontological.html" class="overview-card">
                <h2>Ontological argument</h2>
                <div class="card-btn">View mind map</div>
            </a>

            <a href="design.html" class="overview-card">
                <h2>Design argument</h2>
                <div class="card-btn">View mind map</div>
            </a>

            <a href="cosmological.html" class="overview-card">
                <h2>Cosmological argument</h2>
                <div class="card-btn">View mind map</div>
            </a>
        </div>
    </div>

</body>
</html>
