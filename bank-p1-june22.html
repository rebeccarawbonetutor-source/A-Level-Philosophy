var LEVELS_3 = ["3 A full and correct answer, given precisely, with little or no redundancy.","2 The substantive content of the answer is correct, but there may be some redundancy or minor imprecision.","1 Relevant, but fragmented, points.","0 Nothing written worthy of credit."];
var LEVELS_5 = ["5 A full, clear and precise explanation. The student makes logical links between precisely identified points, with no redundancy.","4 A clear explanation, with logical links, but some imprecision/redundancy.","3 The substantive content of the explanation is present and there is an attempt at logical linking, but the explanation is not full and/or precise.","2 One or two relevant points made, but not precisely. The logic is unclear.","1 Fragmented points, with no logical structure.","0 Nothing written worthy of credit."];
var LEVELS_12 = ["10\u201312 The answer is set out in a precise, fully-integrated and logical form. The content is correct and demonstrates detailed understanding. Points are made clearly and precisely. Relevance is sustained, with very little or no redundancy. Philosophical language is used precisely throughout.","7\u20139 The answer is set out in a clear, integrated and logical form. The content of the answer is correct and demonstrates detailed understanding. The content is clearly relevant and points are made clearly and precisely. Any lack of clarity with respect to particular points is not sufficient to detract from the answer. Relevance is largely sustained. There may be some redundancy, though not sufficient to detract from the answer. Philosophical language is used correctly throughout.","4\u20136 The answer is clear and set out in a coherent form, with logical/causal links identified. The content of the answer is largely correct and most points are made clearly. Relevance is not always sustained and there is some redundancy. Philosophical language is used correctly, with any minor errors not detracting from the response.","1\u20133 There are some relevant points made, but no integration. Some points are clear, but there is a lack of precision \u2013 with possibly insufficient material that is relevant or too much that is irrelevant. Philosophical language is used, though not always consistently or appropriately.","0 Nothing written worthy of credit."];
var LEVELS_25 = ["21\u201325 The student argues with clear intent throughout and the logic of the argument is sustained. The student demonstrates detailed and precise understanding throughout. The conclusion is clear, with the arguments in support of it stated precisely, integrated coherently and robustly defended. Arguments and counter-arguments are stated in their strongest forms. Reasoned judgements are made, on an ongoing basis and overall, about the weight to be given to each argument. Crucial arguments are clearly identified against less crucial ones. Philosophical language is used precisely throughout.","16\u201320 The student argues with clear intent throughout and the logic of the argument is largely sustained. The content is correct and detailed \u2013 though not always consistently. The conclusion is clear, with a range of appropriate arguments supporting it. Arguments are generally stated in their strongest forms. There is a balancing of arguments, with weight being given to each \u2013 so crucial arguments are noted against less crucial ones. Arguments and counter-arguments are stated clearly, integrated coherently and defended. There may be trivial mistakes, as long as they do not detract from the argument. Philosophical language is used correctly throughout.","11\u201315 A clear response to the question, in the form of an argument, demonstrating intent. The content is detailed and correct and most of it is integrated. A conclusion and reasons are given and those reasons clearly support the conclusion. There might be a lack of clarity/precision about the logic of the argument as a whole. Arguments and counter-arguments are given, but there may be a lack of balance. Not all arguments are stated in their strongest forms. Stronger and weaker arguments are noted and there are attempts to identify the weight to be given to different arguments, but not necessarily those which are crucial to the conclusion. Philosophical language is used correctly, with any minor errors not detracting from the argument.","6\u201310 The response to the question is given in the form of an argument, but not fully coherently. The content is largely correct, though there are some gaps and a lack of detail. Relevant points are recognised/identified, but not integrated. Alternative positions are identified, but not precisely. Counter-arguments might be stated in weak forms or even slightly misrepresented. Arguments and counter-arguments are juxtaposed, so similarities and contrasts identified, rather than their impact being clear. Philosophical language is used throughout, though not always fully correctly and/or consistently.","1\u20135 There is little evidence of an argument. There may be missing content, substantial gaps in the content or the content may be one-sided. There may be a conclusion and several reasonable points may be made. There may be some connections between the points, but there is no clear relationship between the points and the conclusion. There is some basic use of philosophical language.","0 Nothing written worthy of credit."];

var DATA = [
{qref:"1",marks:3,ao:"AO1",section:"Epistemology",topic:"Definition of knowledge",tags:["Definition of knowledge"],question:"What is the difference between a necessary truth and a contingent truth?",cap:"",content:["Examples for 3 marks: Necessary truth: A proposition that is true in all (logically) possible worlds. A proposition that is true and could not (possibly) have been false. A truth that could not be otherwise / must be true. A truth the denial of which would be a contradiction. Contingent truth: A proposition that is true in the actual world but not in all (logically) possible worlds. A proposition is true and/but could (possibly) have been false. A truth that could be / could have been otherwise \u2013 does not have to be true. A truth the denial of which would not be a contradiction.","Examples for 2 marks: \u201cContingent truths are capable of being either true or false, but necessary truths are always true / cannot be doubted\u201d; \u201cContingent truths could be false whereas necessary truths are always true\u201d; \u201cNecessary truths are true by definition and cannot be denied without contradiction. Contingent truths depend on something else to be true\u201d.","Examples for 1 mark: \u201cNecessary truths must be true in virtue of meaning alone, whereas this is not the case for contingent truths.\u201d; \u201cContingent truths must be true in every possible world, whereas it is conceivable that necessary truths are false so they are not true in every possible world\u201d; \u201cContingent truths depend on something else, whereas necessary truths don't depend on anything else\u201d; \u201cNecessary truths must be true\u201d; \u201cContingent truths do not have to be true\u201d; \u201cA necessary truth is a truth such as 'bachelors are unmarried men' whereas a contingent truth is a truth such as 'Boris Johnson is Prime Minister'\u201d.","Examples for 0 marks: \u201cNecessary truths are made true in virtue of the meanings of the terms alone/true by definition, whereas contingent truths cannot be known in virtue of the meanings of the terms alone/true by definition\u201d.","Notes: Students may link the analytic / synthetic distinction to the necessary / contingent distinction. So long as students clearly differentiate the two, this should not be judged as redundant (for instance, a student may legitimately illustrate what makes a truth necessary by explaining that it is analytic). If students give a definition of analytic/synthetic truth (delete as appropriate) without linking it to the notions of necessity/contingency, then this cannot get any marks. Students may conflate necessary/contingent truths with necessary/contingent existence. Again, this can get partial credit \u2013 see example for 1 mark above (whether truths depend on something else or not). Students may refer to our ability or otherwise to doubt necessary/contingent truths. This is imprecise and cannot be awarded full credit. If students only say that it is a proposition whose contrary is a necessary/contingent falsehood (delete as appropriate), this can only get 1 mark. It is possible that students may get the terms the wrong way around, but nevertheless have a clear understanding of the distinction. A response which does this should be awarded a maximum of 1 mark.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"2",marks:5,ao:"AO1",section:"Epistemology",topic:"Definition of knowledge",tags:["Definition of knowledge"],question:"Explain the reliabilist definition of knowledge.",cap:"A response that only outlines knowledge as justified true belief without making any attempt to explain what is unique about reliabilism/address reliabilism directly can be awarded a maximum of 1 mark for 'fragmented relevant points'.",content:["The relevant line in the specification is: \u201creplace 'justified' with 'reliably formed' (R+T+B) (ie reliabilism)\u201d. Students are likely to explain the general view in the following way (or similar): S knows that p iff (if and only if) (1) p is true. (2) S believes that p. (3) S's belief that p was produced by a reliable cognitive process. This may be explained as being the necessary and sufficient conditions for knowledge, and these terms might be explained. Knowledge is true belief produced by a reliable method.","This is most likely to be further explained in terms of a reliable cognitive process with a tendency to cause true beliefs. Examples of reliable cognitive processes given by philosophers have included: memory, perception, testimony, introspection.","Some students may mention implications, eg: This is often seen as an \u201cexternalist\u201d view whereby information about the process itself and its reliability need not be introspectively/reflectively accessible to the agent in order for the agent to have knowledge. This may mean that nonhuman animals might be capable of knowledge (presuming that they are capable of having beliefs). Some students may give examples of specific reliabilist accounts, eg Goldman's causal account, Nozick's truth-tracking account, etc. Some students might introduce reliabilism as an attempt to respond to Gettier's objection to the tripartite view.","Notes: Students are free to explain reliabilism in terms of either knowledge or justification (or both). For instance, students may say that knowledge = J+T+B+R.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"3",marks:5,ao:"AO1",section:"Epistemology",topic:"Perception as a source of knowledge",tags:["Perception as a source of knowledge"],question:"Explain how the argument from hallucination presents an issue for direct realism.",cap:"",content:["Direct realism: Direct realism is the position that we always directly or immediately perceive mind-independent physical objects and their properties (inherent or relational). Our perception is therefore not mediated by 'sense-data' and therefore not indirect. Direct realism claims that my perception is constituted by the physical processes which take place between the perceiving subject and the perceived object. Because the physical processes constitute perception they do not mediate perception (eg by causing sense-data).","The direct realist claim of directness and immediacy is, however, not a claim of temporal directness or immediacy, but of epistemological/metaphysical directness and immediacy (there are no mediating objects, sense-data, to make my perception indirect). The argument from hallucination: Students may define 'hallucinations' in a number of ways (eg a non-veridical perceptual experience that is subjectively indistinguishable/qualitatively indistinguishable from a veridical perception).","The logic of the issue can be outlined as follows: P1) In a hallucination, I directly perceive an object (eg a pink elephant). P2) When I hallucinate, there is no physical object of my perception (eg the pink elephant I perceive isn't a physical pink elephant). C1) Therefore, the object I directly perceive in a hallucination isn't a physical object. C2) Therefore, direct realism as defined above is false. The logic of the issue can also be expressed using the phenomenal principle: 'if it appears that there is an object x which has the perceptible quality f then there is an object x which possesses that quality f'. P1) In a hallucination, the object I directly perceive appears to be a pink elephant (there is an object x which has the perceptible qualities of 'pinkness' and 'elephantness'). P2) If the object I directly perceive appears to be a pink elephant, then the object I directly perceive must be a pink elephant (there must be an object which has the perceptible qualities of 'pinkness' and 'elephantness'). P3) The pink elephant that I directly perceive isn't a physical object (the object which has the perceptible qualities of 'pinkness' and 'elephantness' is not a physical object). C1) Therefore, the object I directly perceive in a hallucination isn't a physical object. C2) Therefore, direct realism as defined above is false.","Students may articulate the argument from hallucination as an epistemological point about how/whether direct realists can know/justify their claim that the immediate objects of perception are mind-independent objects, given the possibility of hallucinatory experiences. If taking this approach students may argue: that if we directly perceive sense-data in a hallucination, it is likely that we also directly perceive sense-data in veridical perceptions since hallucinations and veridical perceptions are 'phenomenally indistinguishable' or 'experientially similar.' The easiest way to explain the phenomenal indistinguishability/experiential similarity of hallucinations and veridical perceptions is to suggests that they are perceptions of the same type of object. And since the object we perceive in a hallucination is most likely a sense-datum, it follows that the object we most likely perceive in a veridical perception is also a sense-datum. That, at least, a direct realist cannot know/justify the claim that it is not a sense datum / is a direct experience of mind-independent objects.","Notes: There are a number of ways that students can formulate or explain the argument from hallucination. The above arguments are examples. Students need to be careful not to conflate the argument from hallucination with the argument from illusion (in particular) and perceptual variation. Students can specify what the direct realist takes to be the direct objects of perception in a number of ways, eg 'physical,' 'mind-independent,' 'external'. Students may, but need not, elaborate that if what we directly perceive is not a physical object, it is likely to be a sense-datum (or a collection of sense data).","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"4",marks:12,ao:"AO1",section:"Epistemology",topic:"Perception as a source of knowledge",tags:["Perception as a source of knowledge"],question:"Outline indirect realism and explain Berkeley's objection that mind-dependent ideas cannot be like mind-independent objects.",cap:"",parts:["Outline indirect realism","Explain Berkeley's objection that mind-dependent ideas cannot be like mind-independent objects"],content:["Outline indirect realism... Students will likely begin by explaining indirect realism (IR), which can be most clearly split up into the following claims (especially for the purposes of evaluation): 1. REALISM claim: Mind-independent objects and their properties (objects which exist whether or not they are perceived or conceived of) do exist. 2. SENSE-DATA claim: We immediately perceive mind-dependent sense-data and their properties rather than these mind-independent objects and their properties. 3. REPRESENTATION claim: Our [non-physical] sense-data (normally/can) represent these physical mind-independent objects and their properties (at least to some extent) (meaning that we indirectly perceive them). Students may explain this in terms of the primary/secondary quality distinction, although there is no requirement for them to do so. 4. CAUSATION claim: Our [non-physical] sense-data are (in the end) caused by these physical mind-dependent objects and their properties (i.e. by their effects on our physical bodies/brains).","...and explain Berkeley's objection that mind-dependent ideas cannot be like mind-independent objects. Berkeley is raising an issue relating to the \u201crepresentation claim\u201d. Berkeley understands indirect realists (like Locke) as thinking of representation in terms of resemblance (ie as thinking that sense-data represent the nature of mind-independent physical objects by resembling them). This seems right as Locke claims that primary qualities of objects are those properties of objects that cause ideas that resemble them in those respects.","Berkeley argues against the indirect realist claim that we can and do perceive reality indirectly via a representation which resembles them at least to some extent. Berkeley says: \u201cI can't conceive or understand how anything but an idea can be like an idea\u201d. (Dialogues) His reasoning seems to be that something that is sensed (ie mind-dependent objects/ideas) cannot resemble something that is not, and cannot be, sensed (ie mind-independent objects). Students may also make the following points in relation to Berkeley's criticism: How can sense data, which are 'perpetually fleeting and variable' resemble a physical object which is 'fixed and constant'?","This interpretation above is what we could call the \u201cimpossibility interpretation\u201d: Mind-dependent ideas being like (ie resembling) mind-independent objects is inconceivable and so impossible... and so the indirect realist \u201crepresentation\u201d claim is false... and so indirect realists cannot justify their \u201crepresentation\u201d claim. Here are the relevant passages from Berkeley that support the \u201cimpossibility\u201d interpretation: Dialogues: Phil: There is more. Are material objects in themselves perceptible or imperceptible? Hyl: Properly and immediately nothing can be perceived but ideas. All material things, therefore, are in themselves insensible, and can be perceived only through ideas of them. Phil: Ideas are sensible, then, and their originals\u2014the things they are copies of\u2014are insensible? Hyl: Right. Phil: But how can something that is sensible be like something that is insensible? Can a real thing, in itself invisible, be like a colour? Can a real thing that isn't audible be like a sound? In a word, can anything be like a sensation or idea but another sensation or idea? Hyl: I must admit that I think not. Phil: Can there possibly be any doubt about this? Don't you perfectly know your own ideas? Hyl: Yes, I know them perfectly; for something that I don't perceive or know can't be any part of my idea. Phil: Well, then, examine your ideas, and then tell me if there's anything in them that could exist outside the mind, or if you can conceive anything like them existing outside the mind. Hyl: Upon looking into it I find that I can't conceive or understand how anything but an idea can be like an idea. And it is most evident that no idea can exist outside the mind.\u201d Principles: \u201cBut say you [ie Locke/the indirect realist], though the ideas themselves do not exist without the mind, yet there may be things like them whereof they are copies or resemblances, which things exist without the mind, in an unthinking substance. I answer, an idea can be like nothing but an idea; a colour or figure can be like nothing but another colour or figure. If we look but never so little into our own thoughts, we shall find it impossible for us to conceive a likeness except only between our ideas. Again, I ask whether those supposed originals or external things, of which our ideas are the pictures or representations, be themselves perceivable or no? If they are, then they are ideas and we have gained our point; but if you say they are not, I appeal to any one whether it be sense to assert a colour is like something which is invisible; hard or soft, like something which is intangible; and so of the rest. (Berkeley: PHK 8)","Some interpret as making an epistemological point. If students do this it can be credited: Epistemological interpretation: The claim that mind-dependent ideas are like (ie resemble) mind-independent objects cannot be justified/known as we can't compare one to the other. Here is a relevant passage from Berkeley that supports the \u201cepistemological\u201d interpretation: \u201c16 Two things cannot be said to be alike or unlike till they have been compared 17 Comparing is the viewing two ideas together, & marking what they agree in and what they disagree in. 18 The mind can compare nothing but its own ideas. 19 Nothing like an idea can be in an unperceiving thing.\u201d (Philosophical Commentaries)","Notes: Students might refer to some of Berkeley's other arguments relating to perception such as his attack on the primary and secondary qualities distinction and his master argument. If these points are raised, relevant material within them should be credited. However, students should not confuse these points with the one being asked about in the question. If students do this, it may be classed as imprecision or redundancy depending on the details of the response.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"5",marks:25,ao:"AO2",section:"Epistemology",topic:"Sources of knowledge",tags:["Sources of knowledge","Definition of knowledge","Perception as a source of knowledge","Limits of knowledge"],question:"To what extent is Descartes' intuition and deduction thesis successful?",cap:"",content:["What Descartes' meant by 'Intuition and deduction': Students might contextualise this by describing this as the constructive/positive phase of Descartes' project in the Meditations. Having subjected his beliefs to radical scepticism, Descartes, with his process of intuition and deduction, sees himself as justifying the claims that had been undermined by his methodological scepticism. As Descartes understands the terms, intuition and deduction give us a priori knowledge, ie knowledge that is justified independent of experience (other than any experiences required to understand the proposition that is known).","The intuition and deduction thesis (aka the \u201cmathematical\u201d method): All knowledge is either justified by intuition: ie non-inferentially justified a priori (ie justified independently of experience (other than any experiences required to understand the proposition that is known)). Intuition is not a 'gut feeling' or 'instinct' but is an intellectual capacity to grasp the truth of a self-evident proposition directly and non-inferentially. (Descartes speaks of the 'natural light of reason' and 'clear and distinct ideas'). Descartes thinks we can have knowledge of some propositions on the basis that we are clearly and distinctly aware of their truth (we have a clear and distinct idea). Students can use 'intuition' and 'clear and distinct idea' interchangeably as they are used thus by Descartes (so long as 'clear and distinct idea' refers to a known proposition rather than a grasped concept).","Or justified by deduction: ie is inferentially justified in virtue of being the conclusion of a deductively valid a priori argument (ie one all of whose premises are knowable a priori) - Descartes' own words: \u201cthe inference of something as following necessarily from some other propositions which are known with certainty.\u201d Commitment to the intuition/deduction is associated with rationalism (along with, for many such philosophers, a commitment to some form of innatism).","Descartes takes himself to have proved that the external world exists in three stages (making three key knowledge-claims, underlined below): (1) Intuition: The 'cogito': I know that I exist. (2) Deduction: I deduce that there is a supremely perfect being, God. (3) Deduction: I deduce from God's existence and the nature of my own experience that there is an external world. Student approaches to the question: In arguing that Descartes is successful/unsuccessful students would need to take one or both of the following approaches: Evaluate one or more of the three stages / knowledge-claims above. Evaluate the intuition and deduction thesis/approach in general. The indicative content which follows is organised to reflect these two possibilities.","A: Evaluation of the knowledge-claims that Descartes makes based on intuition and deduction: Gaining a priori knowledge through intuition (the 'cogito'): It is likely that students will focus on the 'cogito' in their discussion of what Descartes thinks can be known through intuition. Some students may give alternative examples of intuitions and this is fine but it is the cogito and the subsequent ideas that Descartes discovers within this mind that form the basis of the next stage in his deduction that there is an external world. The cogito is Descartes' claim that he exists (one's claim that one exists): \u201cI am, I exist\u201d. In the cogito Descartes here understands himself as a thinking thing of which he has a clear and distinct idea (and he is therefore not necessarily identical to his body).","Even if an evil demon is deceiving him about the existence of physical objects (res extensa) and thereby knowledge of the external world/empirical knowledge/knowledge that is justified empirically/synthetic a posteriori knowledge - along with knowledge of mathematical truths (a priori knowledge) the evil demon cannot deceive him about his own existence since, if the evil demon is deceiving him, he must exist to be deceived. \u201cBut there is a supremely powerful and cunning deceiver who deliberately deceives me all the time! Even then, if he is deceiving me I undoubtedly exist: let him deceive me all he can, he will never bring it about that I am nothing while I think I am something.\u201d Meditations. \u201cI conclude that this proposition, I am, I exist, must be true whenever I assert it or think it.\u201d 'Discourse on the method of rightly conducting one's reason and of seeking truth in the sciences'. It is a true belief that is indubitable / immune to doubt / certain and therefore counts as knowledge. It is not known through sense experience / empirical observation. It is a direct or non-inferential awareness of a truth which has been discovered by thinking and reasoning alone. It is therefore a foundational piece of knowledge (some students might link this to Descartes' rational foundationalism).","Students might refer to the 'cogito' as a 'clear and distinct idea' and go on to define 'clear and distinct' in accordance with the definition given in Descartes' Principles of Philosophy: To be clear an idea must be 'open and present to the attending mind.' To be distinct it must not only be clear but precise and separated from other ideas so that it 'plainly contains in itself nothing other than what is clear.' Clear and distinct ideas may be understood as 'principles of natural light', 'self-evident propositions', 'eternal truths', or 'axioms'. Some students might mention that this is arguably an example of synthetic a priori knowledge, given that claims about the actual existence of something are synthetic. For some this is a mark of this being a rationalist position, given that significant non-trivial synthetic a priori knowledge is possible.","Evaluation of the 'cogito': Descartes fails to establish the cogito: all that is established is that there is a thought now, rather than an enduring self. Relatedly, the cogito is not an intuition but instead an inference/deduction (There is thinking, therefore I exist). Some have then made the point above, namely that the conclusion (I exist) cannot be deductively/validly defended. Hume's empiricist objection that experience provides no evidence of an enduring self, and so we have no good reason to think there is one: \u201cThere are some philosophers who imagine we are every moment intimately conscious of what we call our SELF... Unluckily all these positive assertions are contrary to...experience.. For my part, when I enter most intimately into what I call myself, I always stumble on some particular perception or other, of heat or cold, light or shade, love or hatred, pain or pleasure. I never can catch myself at any time without a perception, and never can observe any thing but the perception... I may venture to affirm of the rest of mankind, that they are nothing but a bundle or collection of different perceptions, which succeed each other with an inconceivable rapidity, and are in a perpetual flux and movement.\u201d (A Treatise of Human Nature).","NB: It is important to recognise that, in addition to the 'cogito', there are other examples of knowledge by intuition ('clear and distinct ideas') that are themselves used within Descartes' deductions. For this reason, students may discuss (the truth of) these claims: The causal adequacy principle, that \u201cthe total cause of something must contain at least as much reality as does the effect\u201d, that \u201csomething can't arise from nothing, and that what is more perfect\u2014that is, contains in itself more reality\u2014can't arise from what is less perfect.\u201d The claim that a supremely perfect being has all perfections.","Gaining a priori knowledge through deduction: Successful deduction is the drawing of conclusions that necessarily follow from the premises, ie deductively valid. There are several examples of deductions from Descartes that students may discuss: That God exists (via the ontological, trademark and cosmological arguments) and is no deceiver. That mind and body are distinct substances (via the conceivability and divisibility arguments). That there is a world of physical objects external to mind (via his awareness that his perceptions of such a world are involuntary and God exists and is no deceiver).","Deduction: I deduce that there is a supremely perfect being, God. Descartes' ontological argument: P1: My (or the) idea of God is an idea of a supremely perfect being; P2: A supremely perfect being has all perfections; P3: Existence is a perfection; C: Therefore, God (necessarily) exists. At times Descartes seems to treat this not as an (extended deductive) argument but instead as a self-evident intuition: it starts with an innate concept of God that we may attend to or discover within our minds (expect analogies of triangles and mountains/valleys). Evaluation of this might involve some of the following: Hume's point that nothing necessarily exists, and no synthetic truths (\u201cmattes of fact\u201d) can be demonstrated a priori. Kant's argument that \u201cexistence/being\u201d cannot be considered \u201ca (real) predicate\u201d. Descartes' argument is especially vulnerable to this objection when he is interpreted as advancing an argument of the definitional variety, where existence appears in a list of perfections Descartes insists on using to define God (but one need not be committed to this understanding of Descartes). Leibniz's argument that there is a missing (or supressed) premise in Descartes's presentation of the argument as Descartes had not explicitly demonstrated that the concept of God was coherent.","Descartes' cosmological argument(s): Students may discuss either or both of the following arguments (though for Descartes they are two parts of one overall argument): (1) God as cause of my idea of God: I have an idea of a supremely perfect being (ie God): that is, an infinite being. By the 'causal adequacy principle' (ie that there must be at least as much (total) reality in the cause as in the effect), I cannot be the cause of this idea as I am finite. Only God could be the cause of this idea and so God must exist. This is the argument often referred to as the \u201ctrademark\u201d argument. (2) God as cause of my existence (with an idea of God in my mind): I exist as a being with an idea of a supremely perfect being. The only possible cause of my existence as such is God. I cannot be the cause of myself as I would then be God and I know I am not. No other being(s) could be the cause because either the question would be raised about them (leading to a regress) or they could not account for the idea of God that I have. Nor can I have no cause, as a cause is needed to sustain anything finite from one moment to the next.","Evaluation of these arguments might involve some of the following: Challenging the causal adequacy principle. Arguing (as Hume did) that the concept of God is a concept that can be acquired from experience (of finite qualities). Challenging the claim that my continued existence requires a sustaining cause.","Deduction: I deduce from God's existence that there is an external world (as otherwise God would be a deceiver). Descartes' argument can be reconstructed in the following way: P1: I have perceptual experiences as if of physical objects. P2: These perceptual experiences must have a cause. P3: This cause must be either my own mind, God, or external physical objects. P4: If the cause were my own mind, those perceptual experiences would be voluntary/under my control. P5: However, they are not voluntary/under my control. P6: If the cause was God, then those perceptual experiences would be deceptive (given that I have a very strong tendency to believe that physical objects exist). P7: However, they cannot be deceptive as God exists and is not a deceiver. C1: Therefore, those perceptual experiences must be caused by external physical objects. C2: Therefore, there is an external world of physical objects.","Evaluation of this might involve some of the following: God might be the direct cause of my experiences without being a deceiver (a position taken by, eg, Berkeley). I might be causing my own experiences without knowing that I am (as happens within a dream). It would not be deceptive of God to give me ideas of an external world not caused by those things themselves (eg Malebranche's position that I perceive material things \u201cin God\u201d, ie I immediately perceive ideas in God, and via these ideas, I indirectly perceive corporeal objects). The \u201cCartesian circle\u201d objection: Students might also discuss what has become known as the \u201cCartesian circle\u201d as a key issue with Descartes' attempted proof, namely that Descartes' claims that (a) our knowledge that our intuitions/clear and distinct ideas are true depends on our knowledge that a non-deceiving God exists and that (b) our knowledge that a non-deceiving God exists depends on our knowledge that particular intuitions/clear and distinct ideas (which are premises in Descartes' arguments for God's existence) are true.","B: Evaluation of the intuition and deduction thesis/approach in general: Challenge the possibility of non-inferentially justified \u201cfoundational\u201d knowledge from intuition. Perhaps by invoking the claim that everything that can be known must be justified by some other piece of knowledge (and then either (a) embracing the infinite regress of justification that follows, (b) defending an alternative account of the structure of knowledge (eg coherentism) or (c) arguing that this 'regress' should lead us to scepticism about the possibility of knowledge).","Arguing, in general, that all a priori knowledge is nothing more than knowledge of analytic truths, which are true solely in virtue of the meanings of its constituent terms/concepts (and how they're combined)) and not factually significant. Students might make reference here to Hume's 'fork' (the distinction between \u201cmatters of fact\u201d and \u201crelations of ideas\u201d) or the verification principle. It can be argued (\u00e0 la Berkeley) that mind-dependent ideas being like (ie resembling) mind-independent objects is inconceivable and so impossible and so (Descartes') indirect realist \u201crepresentation\u201d claim is false and so indirect realists cannot justify their \u201crepresentation\u201d claim. This would mean that knowledge of the (nature of the) external world is impossible. This could be expressed as the view that indirect realism would necessarily involve deception if we assume, as Descartes does, that we have a very strong tendency to believe that physical objects exist. It can be claimed that justifications that involve our experiences should not be regarded as a priori justifications: In relation to the cogito, this might be that it is my experience of my own thoughts, and perhaps even my 'self', that grounds my knowledge of my own existence. In relation to the argument for the external world, a key premise (P1, as presented above) can only be known a posteriori.","Notes: Students should not conflate the intuition and deduction thesis with innatism. Although there may be some overlap with arguments around each of these positions \u2013 particularly in relation to proofs for God's existence \u2013 the focus of responses should be to assess the intuition and deduction thesis rather than innatism. Students should not be unduly penalised for misattributing arguments/views (where it does not confuse the point they are trying to make): Persistent misattribution of arguments/views would be an inaccuracy that would justify not awarding an answer full marks, but it should not be regarded as a reason for excluding it from the top band (assuming everything else meets the requirements of the level descriptors).","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"6",marks:3,ao:"AO1",section:"Moral philosophy",topic:"Kantian ethics",tags:["Kantian ethics"],question:"What does Kant mean by 'hypothetical imperative'?",cap:"",content:["Students need to explain both aspects below in order to get full marks (though we do not expect them to separate it out as we have done---it may be explained all together---and their wording of the points might be different):","Hypothetical imperative: 1. imperative: this is a statement commanding a course of action; it is a statement about what one ought to do; it is a command / an order. 2. hypothetical: a statement which applies to agents on the condition that they have (in Kant's wording, that they \u201cwill\u201d) specific ends/goals, so a statement of the form 'Do X if you will that Y'. It asserts \u201cthe practical necessity of a possible action as means to something else that is willed\u201d (Kant, Groundwork)--- Whether such an imperative applies will depend upon an agent's ends/goals.","Examples for 3 marks: \u201cHypothetical imperatives are 'If... then'...' statements that tell us what we ought to do to achieve our goals\u201d; \u201cA hypothetical imperative is a rule that should be followed in order to achieve certain ends / goals\u201d; \u201cA hypothetical imperative takes the form 'if you want X then you should do Y'.","Examples for 2 marks: \u201cHypothetical imperatives tell us what we should do, but this only applies in certain situations / is dependent on circumstances/ is not universally applicable\u201d.","Examples for 1 mark: \u201cA hypothetical imperative is an 'if...then...' statement\u201d; \u201cA rule/command/instruction that changes/is changeable (rather than universal)\u201d; \u201cHypothetical imperatives are those that only apply if a person has certain wants/desires/goals/ends\u201d.","Examples for 0 marks: \u201cHypothetical imperatives are duties\u201d; \u201cHypothetical imperatives depend on circumstances\u201d; \u201cThese are imperatives that are not categorical\u201d.","Notes: Students may frame the 'hypothetical' claim in terms of an agent's 'wants/desires' rather than 'ends/goals'. This is fine and should be credited. Students may frame the 'imperative' claim using terms such as 'rules', 'instructions' or 'prescriptions'. This is fine and should be credited. Students may use examples to illustrate, but an example if not necessary to score full marks. Students may refer to categorical imperatives and contrast these with hypothetical. Contrasting hypothetical with categorical imperatives to explain/illustrate the nature of hypothetical imperatives is acceptable and should not be deemed redundant. However, students do not need to refer to categorical imperatives to score full marks. Students should not refer to hypothetical imperatives as moral statements or duties \u2013 this is inaccurate.","Note: This indicative content is not exhaustive: other creditworthy responses should be rewarded with reference to the generic mark scheme."]},
{qref:"7",marks:5,ao:"AO1",section:"Moral philosophy",topic:"Virtue ethics",tags:["Virtue ethics"],question:"Explain the 'skill analogy' that Aristotle uses in his account of virtue.",cap:"",content:["The context of the skill analogy is Aristotle's account of how you acquire the moral virtues/become virtuous. He draws an analogy between acquiring a skill and becoming virtuous. He discusses acquiring the skills of building and playing the lyre \u2013 although other examples of skill development may be deployed by students. No-one is born able to play the lyre; rather, we have the capacity to play the lyre. No-one is born virtuous; rather we have the capacity to become virtuous. We don't learn to play the lyre and then play it. We learn by playing. We don't learn to be virtuous, then be virtuous. We become virtuous by doing virtuous actions. To become a lyre player, we need to practise. We do this by playing until playing becomes a fixed disposition \u2013 so by habituation. To become a virtuous person, we need to practise. We do this by doing virtuous actions until being virtuous becomes a fixed disposition \u2013 so by habituation. It is helpful to have a good teacher or at least a good model to help you to acquire the ability to play the lyre. It is helpful to have a virtuous person to educate you or at least to be a role model to help you become virtuous.","Students might give examples, such as becoming temperate by repeatedly refusing to indulge yourself, until you start to find abstaining from indulgence pleasant. Students might provide an outline of Aristotle's account of virtue in a number of ways, including: Virtues understood as dispositions; Being virtuous involves having certain feelings to the right degree / being guided by reason; Virtues are understood in contrast to vices (i.e. Golden mean). Students might explain how development of virtue links to eudaimonia.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"8",marks:5,ao:"AO1",section:"Moral philosophy",topic:"Kantian ethics",tags:["Kantian ethics"],question:"Explain the criticism that Kant ignores the value of certain motives.",cap:"",content:["Kant claims that for an action to be morally good it must be motivated by a good will. This means that one is motivated by duty alone (by the recognition that doing X is one's duty). One must therefore act out of duty, not merely in accordance with duty (ie one does not just do what duty demands, but one also does it only because duty demands it). To be motivated by one's desires is to act heteronomously as opposed to autonomously. For Kant this is linked to the claim that it is reason that ought to motivate us when it comes to morality (contra Hume, for whom action requires desires/emotions).","The kinds of motives that Kant allegedly ignores the value of are: the desire to do good; the desire to help others (where this is not because this has been identified as a duty); the desire to help those with whom you have a relationship; self-interest / the desire to be happy; motives relating to emotions such as love, grief, guilt, empathy.","For this to be a criticism of Kant, as opposed to just a truth about what he claims, the student should emphasise that, according to such an objection, such motives would need to be seen as valuable (morally or otherwise).","Students may explain the possible value of certain motives such as desires and emotions with reference to the Humean view that \u201creason is the slave of the passions\u201d \u2013that it is not possible to be motivated by reason alone, and desires / emotions must have value since they are the only things capable of motivating actions. Aristotle and the utilitarians might also argue that duty should motivate us but they would specify our duty either eudaimonistically (Aristotle) or with reference to utility (utilitarianisms) and not solely with reference to reason and a good will alone.","Note: This indicative content is not exhaustive: other creditworthy responses should be rewarded with reference to the generic mark scheme."]},
{qref:"9",marks:12,ao:"AO1",section:"Moral philosophy",topic:"Utilitarianism",tags:["Utilitarianism"],question:"Explain hedonistic utilitarianism and explain the criticism that it ignores the moral integrity of the individual.",cap:"",parts:["Explain hedonistic utilitarianism","The criticism that it ignores the moral integrity of the individual"],content:["Explain hedonistic utilitarianism... Hedonistic (\u201cclassical\u201d) utilitarianism: \u201cUtilitarianism\u201d: An act is morally right iff (if and only if) we can reasonably expect / predict that doing it produces at least as much utility as any other act that could be performed. \u201cHedonistic\u201d: Utility = sensations of pleasure or happiness - ie something that can be experienced by a being. Other points that students might make within their explanation: Utilitarianism is a form of consequentialism \u2013 so whether actions are morally right or wrong is determined by their effects. Hedonistic utilitarians would consider the pleasures of all those affected equally. This is the impartiality dimension of the position: \u201cevery man to count for one, nobody for more than one\u201d (Bentham).","Students might discuss Bentham, Mill or both in their explanation: For Bentham, the quantity of pleasurable sensations is all that is important (Bentham's quantitative hedonistic utilitarianism - his utility calculus). For Mill the quality of pleasure [also] matters (Mill's qualitative hedonistic utilitarianism \u2013 his distinction between higher and lower pleasures). They may also discuss the application of hedonistic utilitarianism to animals: ie if animals have the appropriate sensations of pleasure and pain, then they should be included in the moral reasoning/calculating, if not they will not.","...and the criticism that it ignores the moral integrity of the individual. Here it is argued that utilitarians wrongly ignore moral integrity of the agent: ie their (moral) character and their commitments, projects, convictions, beliefs - the kind of person they are. This objection is associated with Bernard Williams.","Williams develops the point with two examples/dilemmas: (1) George is a recent doctoral graduate in chemistry who is having difficulty finding work and is in poor health. He has a wife and young children. George is a committed pacifist, what Williams calls an \u201cidentity-conferring commitment\u201d (ie one that is part of who he is). George gets a chance to take a well-paid job related to biological and chemical warfare. If George says no, it is likely that the job will go to another chemist, one who is not a pacifist and will work harder than George would have. Should George take the job or not? (2) A group of twenty innocent South American Indians have been chosen at random by the Captain to be killed as a warning to those that might also protest against the government. Jim, an explorer, who has happened upon this village, is told that if he kills one of them (a \u201cguest's privilege\u201d) then the other nineteen will be spared. Otherwise all twenty will be killed. Should Jim kill the one Indian?","If hedonistic utilitarianism is true: The right (and, it would appear, obviously right) thing to do is for George to take the job and for Jim to kill the Indian. Moreover, the way in which this decision is reached does not give any special consideration to pertinent facts about the decision-maker/the person who must take the action.","The utilitarianism decision-making procedure, however, demands that George and Jim act without integrity, abandoning or ignoring their identity as decision-makers and perhaps even their identity- conferring commitments. They must act in such a way that their act has nothing at all to do with who they really are at the most fundamental level. Students may put this in terms of utilitarianism regarding agents as mere utility calculators \u2013 which they are not and should not be expected to be. Students might also explain this issue by explaining that there is no part of who you are (your integral characteristics) that utilitarianism could not, in principle, demand you to abandon if the circumstances are right.","As Williams himself puts it: \u201cThe point is that [the agent] is identified with his actions as flowing from projects or attitudes which... he takes seriously at the deepest level, as what his life is about... It is absurd to demand of such a man, when the sums come in from the utility network which the projects of others have in part determined, that he should just step aside from his own project and decision and acknowledge the decision which utilitarian calculation requires. It is to alienate him in a real sense from his actions and the source of his action in his own convictions. It is to make him into a channel between the input of everyone's projects, including his own, and an output of optimific decision; but this is to neglect the extent to which his projects and his decisions have to be seen as the actions and decisions which flow from the projects and attitudes with which he is most closely identified. It is thus, in the most literal sense, an attack on his integrity.\u201d","It is possible that some students might discuss this objection through the lens of an Aristotelian ethical framework: ie to act morally requires that one has habituated and internalised the virtues, and so one's moral integrity (and personal integrity) would not be compromised when making (appropriate) moral decisions.","Notes: Students must not conflate the issue of integrity with other issues such as individual rights and liberties, partiality and intentions. Students could potentially do this to a greater or lesser extent \u2013 ranging from minor imprecision/blurring of issues together through to entirely redundant focus on the wrong issue. Credit should be awarded accordingly.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"10",marks:25,ao:"AO2",section:"Moral philosophy",topic:"Meta-ethics",tags:["Meta-ethics"],question:"Is moral anti-realism the correct metaethical view?",cap:"",content:["What is meant by anti-realism and what views count as anti-realist? Moral anti-realism covers a great many theories, and there are both cognitivist and non-cognitivist theories that have been classified as anti-realist. Typically what all moral anti-realists have in common is that they claim... either (a) there are no moral properties/facts at all or (b) there are moral properties/facts but they are all mind-dependent.","(Moral) cognitivist moral anti-realism (aka error theory) claims that: There are no mind-independent moral properties/facts... but moral predicates/concepts contribute to the descriptive/factual meaning of propositions and so can be used to express cognitive belief states - moral utterances are truth-apt (there can be factually/cognitively meaningful moral propositions/assertions)... however all moral propositions that assert or imply the existence of mind-independent moral properties (ie those propositions that are sometimes called \u201catomic\u201d or \u201cfirst-order\u201d moral propositions) are false.","(Moral) non-cognitivist moral anti-realism claims that: There are no mind-independent moral properties/facts... and moral predicates/concepts do not contribute to the descriptive/factual meaning of propositions and so cannot be used to express cognitive belief states - moral utterances are not truth-apt (there cannot be factually/cognitively meaningful moral propositions/assertions)... Some moral non-cognitivists then go on to explain what moral utterances are instead doing, what their function in fact is: Emotivism: The inclusion of moral terms in utterances serves to express the emotions of the person (eg. Ayer). Prescriptivism: The inclusion of moral terms in utterances serves to command or commend behaviour so they are imperatives. The claim that 'x is morally right' means 'do x' (an imperative) and includes the commitment that everyone in the same (/sufficiently similar) situation should do x (universality).","In opposition to this, there are many theories that might be considered to be versions of moral realism, and it is possible that students might argue for, or use, such positions as a way of challenging moral anti-realism: moral realism includes naturalist realist views (eg some versions of utilitarianism and virtue ethics) and non-naturalist views (eg intuitionism, divine command theory, Platonism, Kantian Deontology). There may also be versions of moral realism that relate to contractarian views. NB: There is widespread debate about how best to characterise the distinction between realism and anti-realism about X, and ethics is no exception. It is important that the student is clear about their approach and is clear about their understanding of realism.","Conclusions may be drawn from the following: YES: moral anti-realism is the right account of metaethics \u2013 ie the student may support and/or defend the account. This may be done by, in the end, supporting/defending a particular version (or some versions) of moral anti-realism... or by defending it in general but with particular versions being employed as examples of how moral anti-realists might fill out their account... or by defending it in general with no reference to any particular versions of moral anti-realism.","NO: moral anti-realism is not the right account of metaethics \u2013 ie the student may argue that it cannot be adequately supported and/or that there are (fatal) issues with the account. This may be done by arguing that prominent versions of moral anti-realism fail to adequately respond to issues... and/or by arguing that a particular version of moral realism succeeds (either a naturalist version or a non-naturalist version)... and/or by arguing that moral realism in general succeeds for general reasons... or by arguing that there are general issues that cannot (in general) be responded to by moral anti-realists.","Arguments supporting moral anti-realism: Mackie's argument from relativity: widespread and intractable moral disagreement (and a lack of a procedure by which we can resolve it) is best explained by the falsity of moral realism (and therefore moral realism is (probably) false). In response one might argue that: there is more agreement than Mackie implies; the disagreement is about the non-moral facts rather than the moral facts; there is disagreement in other areas that we may be realists about (eg scientific disagreement); that disagreement can be explained by people having inferior access to mind-independent moral properties.","Mackie's argument/s from queerness: mind-independent moral properties, if they existed, would be metaphysically \u201cqueer\u201d (and knowledge of them would therefore require such an epistemologically \u201cqueer\u201d faculty) - ie they would be completely different to any other property that we have reason to believe exist \u2013 and so it is implausible that they exist (and so implausible that moral realism is true). In response one might argue that: this would also support a non-naturalist realist position (eg Plato's account in which knowledge of the form of the good would motivate us); this would also support the view that there must be natural moral properties of a \u201cqueer\u201d sort that cannot be reduced to non-moral natural properties (ie non-reductive moral naturalism); there are other properties that have similar characteristics, eg painfulness / pleasureableness.","Hume's Fork: moral propositions are neither relations of ideas nor matters of fact, therefore moral knowledge is impossible (and so moral realism, which arguably holds that they are matters of fact, is false). Ayer's verification principle: moral sentences are neither analytically true (or false) nor can they be verified by experience, therefore they are not cognitively meaningful and so non-cognitivist moral anti-realism is true. Hume's is-ought gap: propositions about morality (\u201cought\u201d statements) cannot be legitimately deduced from propositions about what is the case (\u201cis\u201d statements) (and so moral realism, is false, assuming that propositions about facts/properties are all \u201cis\u201d statements). Hume's argument that moral utterances do not express beliefs (moral mental states are not beliefs) since beliefs alone could not motivate us (arguably) supports non-cognitivist moral anti-realism). In response, one could be an externalist about moral motivation.","Arguments opposing moral anti-realism: Moral realism is the best explanation of the ways in which we use moral language, including moral reasoning, persuading, disagreeing etc. \u2013 ie it is unlikely that such widespread commitments and practices would exist if there were no truth to moral claims (eg when people disagree it is because they think there are facts that would settle the disagreement). Moral anti-realism is committed to the implausible claim that there can be no such thing as moral progress (eg that it is not better if there is less prejudice against women (as is the case in many, but not all, countries)). One might argue (pace Mackie) that there is agreement about moral claims and that this counts in favour of moral realism: very many common basic moral principles across societies. Phenomenology: one might argue that we perceive that acts (eg torture) are wrong.","Notes: Students should not be unduly penalised for misattributing arguments/views (where it does not confuse the point they are trying to make): Persistent misattribution of arguments/views would be an inaccuracy that would justify not awarding an answer full marks, but it should not be regarded as a reason for excluding it from the top band (assuming everything else meets the requirements of the level descriptors). Students can access the full range of marks by focusing on and assessing anti-realist theories in their own right (eg those named on the specification) or may choose to deploy realist theories and issues with these).","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]}

var TOPIC_BUTTONS = ["Definition of knowledge","Perception as a source of knowledge","Sources of knowledge","Limits of knowledge","Meta-ethics","Utilitarianism","Kantian ethics","Virtue ethics"];
var sectionFilter="all",topicFilter="all",aoFilter="all";
var expanded={};
var atext={};
var PAGEKEY="p1-jun22";
function stripTags(s){var d=document.createElement("div");d.innerHTML=s;return(d.textContent||"").toLowerCase();}
function getFiltered(){var out=[];for(var i=0;i<DATA.length;i++){var d=DATA[i];
if(sectionFilter!=="all"&&d.section!==sectionFilter)continue;
if(aoFilter!=="all"){var parts=aoFilter.split("-");if(d.ao!==parts[0]||String(d.marks)!==parts[1])continue;}
if(topicFilter!=="all"){var m=false;for(var t=0;t<d.tags.length;t++){if(stripTags(d.tags[t])===stripTags(topicFilter)){m=true;break;}}if(!m)continue;}
out.push(d);}
return out;}
function buildTopicButtons(){var h=document.getElementById("topic-buttons");var html="<button class='active' data-t='all' onclick=\"setTopicFilter('all', this)\">All</button>";
for(var i=0;i<TOPIC_BUTTONS.length;i++){var t=TOPIC_BUTTONS[i];html+="<button data-t='"+t+"' onclick=\"setTopicFilter('"+t+"', this)\">"+t+"</button>";}
h.innerHTML=html;}
function esc(s){return s.replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">");}
function key(idx){return PAGEKEY+"-"+DATA[idx].qref;}
function attemptHtml(d,idx){var k=key(idx);var h="<div class='attempt'>";
if(d.marks===25){
h+="<div class='subsec'>Introduction</div>";
h+="<label>Outline the issue (AO1)</label><textarea id='"+k+"-i1'>"+(atext[k+"-i1"]||"")+"</textarea>";
h+="<label>Statement of intent</label><textarea id='"+k+"-i2'>"+(atext[k+"-i2"]||"")+"</textarea>";
h+="<label>Promise of weighting and balance</label><textarea id='"+k+"-i3'>"+(atext[k+"-i3"]||"")+"</textarea>";
h+="<div class='subsec'>Main body</div>";
for(var t=1;t<=4;t++){h+="<div class='threadgrid'>";
h+="<div><label>Argument "+t+"</label><textarea id='"+k+"-a"+t+"'>"+(atext[k+"-a"+t]||"")+"</textarea></div>";
h+="<div><label>But "+t+"</label><textarea id='"+k+"-b"+t+"'>"+(atext[k+"-b"+t]||"")+"</textarea></div>";
h+="<div><label>Conclusion "+t+"</label><textarea id='"+k+"-c"+t+"'>"+(atext[k+"-c"+t]||"")+"</textarea></div>";
h+="</div>";}
h+="<div class='subsec'>Conclusion</div>";
h+="<label>Final argument / synthesis</label><textarea id='"+k+"-f'>"+(atext[k+"-f"]||"")+"</textarea>";
}else if(d.marks===12&&d.parts){
for(var p=0;p<d.parts.length;p++){h+="<label>Part "+(p+1)+": "+esc(d.parts[p])+"</label><textarea id='"+k+"-p"+p+"'>"+(atext[k+"-p"+p]||"")+"</textarea>";}
}else{
h+="<label>Your answer</label><textarea id='"+k+"-x'>"+(atext[k+"-x"]||"")+"</textarea>";}
h+="<button onclick=\"revealMs('"+k+"',"+idx+")\">Submit and reveal mark scheme</button>";
h+="<button class='ghost' onclick=\"saveAttempt('"+k+"',"+idx+")\">Save attempt</button>";
h+="<div class='savednote' id='note-"+k+"'>"+(atext["shown-"+k]?"Mark scheme revealed. Attempts are saved in this browser.":"Attempt is saved in this browser.")+"</div>";
h+="</div>";return h;}
function levelsHtml(d){var L=d.marks===25?LEVELS_25:d.marks===12?LEVELS_12:d.marks===5?LEVELS_5:LEVELS_3;
var h="<div class='levels'>";for(var i=0;i<L.length;i++){h+="<p>"+L[i]+"</p>";}h+="</div>";return h;}
function msHtml(d){var h="<div class='ms'><h3>Mark scheme ("+(d.marks===25?"AO1 = 5, AO2 = 20":"AO1 = "+d.marks)+")</h3>";
h+=levelsHtml(d);
if(d.cap)h+="<div class='cap'>"+d.cap+"</div>";
for(var i=0;i<d.content.length;i++){h+="<p>"+d.content[i]+"</p>";}
h+="<h3>Source</h3><p>AQA 7172/1 mark scheme, June 2022 series.</p></div>";return h;}
function render(){var q=document.getElementById("qlist");q.innerHTML="";var rows=getFiltered();
if(rows.length===0){q.innerHTML="<p class='empty'>No questions match the selected filters.</p>";return;}
for(var i=0;i<rows.length;i++){var d=rows[i];var idx=DATA.indexOf(d);var k=key(idx);
var card=document.createElement("div");card.className="qcard";
var html="<div class='qhead'><span class='qref'>Q"+d.qref+"</span><span class='badge "+(d.ao==="AO1"?"b-ao1":"b-ao2")+"'>"+d.ao+" &bull; "+d.marks+" marks</span><span class='topic'>"+d.section+" &bull; "+d.topic+"</span></div>";
html+="<div class='qtext'>"+d.question+"</div>";
html+="<button onclick=\"toggleDetail("+idx+")\">"+(expanded[idx]?"Hide":"Open answer space and mark scheme")+"</button>";
if(expanded[idx]){html+="<div class='detail'>";
html+="<div class='d-label'>AO target</div><p>"+(d.marks===25?"AO1 = 5, AO2 = 20 (25 marks). 25-mark questions are labelled AO2 as the dominant objective.":"AO1 = "+d.marks+" ("+d.marks+" marks).")+"</p>";
html+="<div class='d-label'>Your answer</div>"+attemptHtml(d,idx);
if(atext["shown-"+k]){html+="<div class='d-label'>Mark scheme</div>"+msHtml(d);}
html+="</div>";}
card.innerHTML=html;q.appendChild(card);}}
function toggleDetail(idx){if(expanded[idx]){delete expanded[idx];}else{expanded[idx]=true;}render();}
function setActive(h,b){var bs=document.querySelectorAll("#"+h+" button");for(var i=0;i<bs.length;i++)bs[i].classList.remove("active");b.classList.add("active");}
function setSectionFilter(f,b){sectionFilter=f;setActive("section-buttons",b);render();}
function setTopicFilter(f,b){topicFilter=f;setActive("topic-buttons",b);render();}
function setAoFilter(f,b){aoFilter=f;setActive("ao-buttons",b);render();}
function collectAttempt(k,idx){var d=DATA[idx];
if(d.marks===25){var ids=["i1","i2","i3","a1","b1","c1","a2","b2","c2","a3","b3","c3","a4","b4","c4","f"];
for(var i=0;i<ids.length;i++){var el=document.getElementById(k+"-"+ids[i]);if(el)atext[k+"-"+ids[i]]=el.value;}}
else if(d.marks===12&&d.parts){for(var p=0;p<d.parts.length;p++){var el2=document.getElementById(k+"-p"+p);if(el2)atext[k+"-p"+p]=el2.value;}}
else{var el3=document.getElementById(k+"-x");if(el3)atext[k+"-x"]=el3.value;}}
function saveAttempt(k,idx){collectAttempt(k,idx);try{localStorage.setItem("aqabank",JSON.stringify(atext));}catch(e){}
document.getElementById("note-"+k).textContent="Attempt saved in this browser.";}
function revealMs(k,idx){collectAttempt(k,idx);atext["shown-"+k]=true;try{localStorage.setItem("aqabank",JSON.stringify(atext));}catch(e){}
render();}
try{var saved=localStorage.getItem("aqabank");if(saved)atext=JSON.parse(saved);}catch(e){}
buildTopicButtons();
render();
</script>
</body>
</html>
