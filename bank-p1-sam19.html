var LEVELS_3 = ["3 A full and correct answer, given precisely, with little or no redundancy.","2 The substantive content of the answer is correct, but there may be some redundancy or minor imprecision.","1 Relevant, but fragmented, points.","0 Nothing written worthy of credit."];
var LEVELS_5 = ["5 A full, clear and precise explanation. The student makes logical links between precisely identified points, with no redundancy.","4 A clear explanation, with logical links, but some imprecision/redundancy.","3 The substantive content of the explanation is present and there is an attempt at logical linking, but the explanation is not full and/or precise.","2 One or two relevant points made, but not precisely. The logic is unclear.","1 Fragmented points, with no logical structure.","0 Nothing written worthy of credit."];
var LEVELS_12 = ["10\u201312 The answer is set out in a precise, fully-integrated and logical form. The content is correct and demonstrates detailed understanding. Points are made clearly and precisely. Relevance is sustained, with very little or no redundancy. Philosophical language is used precisely throughout.","7\u20139 The answer is set out in a clear, integrated and logical form. The content of the answer is correct and demonstrates detailed understanding. The content is clearly relevant and points are made clearly and precisely. Any lack of clarity with respect to particular points is not sufficient to detract from the answer. Relevance is largely sustained. There may be some redundancy, though not sufficient to detract from the answer. Philosophical language is used correctly throughout.","4\u20136 The answer is clear and set out in a coherent form, with logical/causal links identified. The content of the answer is largely correct and most points are made clearly. Relevance is not always sustained and there is some redundancy. Philosophical language is used correctly, with any minor errors not detracting from the response.","1\u20133 There are some relevant points made, but no integration. Some points are clear, but there is a lack of precision \u2013 with possibly insufficient material that is relevant or too much that is irrelevant. Philosophical language is used, though not always consistently or appropriately.","0 Nothing written worthy of credit."];
var LEVELS_25 = ["21\u201325 The student argues with clear intent throughout and the logic of the argument is sustained. The student demonstrates detailed and precise understanding throughout. The conclusion is clear, with the arguments in support of it stated precisely, integrated coherently and robustly defended. Arguments and counter-arguments are stated in their strongest forms. Reasoned judgements are made, on an ongoing basis and overall, about the weight to be given to each argument. Crucial arguments are clearly identified against less crucial ones. Philosophical language is used precisely throughout.","16\u201320 The student argues with clear intent throughout and the logic of the argument is largely sustained. The content is correct and detailed \u2013 though not always consistently. The conclusion is clear, with a range of appropriate arguments supporting it. Arguments are generally stated in their strongest forms. There is a balancing of arguments, with weight being given to each \u2013 so crucial arguments are noted against less crucial ones. Arguments and counter-arguments are stated clearly, integrated coherently and defended. There may be trivial mistakes, as long as they do not detract from the argument. Philosophical language is used correctly throughout.","11\u201315 A clear response to the question, in the form of an argument, demonstrating intent. The content is detailed and correct and most of it is integrated. A conclusion and reasons are given and those reasons clearly support the conclusion. There might be a lack of clarity/precision about the logic of the argument as a whole. Arguments and counter-arguments are given, but there may be a lack of balance. Not all arguments are stated in their strongest forms. Stronger and weaker arguments are noted and there are attempts to identify the weight to be given to different arguments, but not necessarily those which are crucial to the conclusion. Philosophical language is used correctly, with any minor errors not detracting from the argument.","6\u201310 The response to the question is given in the form of an argument, but not fully coherently. The content is largely correct, though there are some gaps and a lack of detail. Relevant points are recognised/identified, but not integrated. Alternative positions are identified, but not precisely. Counter-arguments might be stated in weak forms or even slightly misrepresented. Arguments and counter-arguments are juxtaposed, so similarities and contrasts identified, rather than their impact being clear. Philosophical language is used throughout, though not always fully correctly and/or consistently.","1\u20135 There is little evidence of an argument. There may be missing content, substantial gaps in the content or the content may be one-sided. There may be a conclusion and several reasonable points may be made. There may be some connections between the points, but there is no clear relationship between the points and the conclusion. There is some basic use of philosophical language.","0 Nothing written worthy of credit."];

var DATA = [
{qref:"1",marks:3,ao:"AO1",section:"Epistemology",topic:"Limits of knowledge",tags:["Limits of knowledge"],question:"What is philosophical scepticism?",cap:"",content:["Philosophical scepticism is generally used as an approach to testing the strength of knowledge claims and better understanding the nature of knowledge and justification.","Philosophical scepticism arises when the sceptic's hypothesis/challenge is said to render one's ordinary evidence insufficient for justifying one's belief that p. The grounds for doubt cannot be removed by ordinary evidence (but may be combatted by philosophical argument).","(Students might add that philosophical scepticism can arise from arguments that claim, for example, that all knowledge is circular and hence unjustified).","Philosophical scepticism can be applied to classes of propositions, so doubt about one member of a class casts doubt on the whole class.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"2",marks:5,ao:"AO1",section:"Epistemology",topic:"Perception as a source of knowledge",tags:["Perception as a source of knowledge"],question:"Explain one way in which a direct realist could respond to the argument from illusion.",cap:"",content:["Students might give a brief outline of the full argument from illusion, though this is not a requirement and should not, in the absence of a direct realist response, receive credit. Students should, however, make clear which premise(s) in the argument are the focus for the direct realist's response.","The direct realist can challenge the premise in the argument from illusion that 'when we perceive something having some property F, then there is something that has this property'.","It is not the case that the direct object of perception has the illusory property F, but has the property of looking-F, which is a relational property (the relata being subject, object and some collection of factors defining a perceptual circumstance or context, such as the spatiotemporal point of view and sense-modality).","Direct realism claims that what we perceive are physical objects but it does not have to claim that all their properties, as we perceive them, are mind-independent.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"3",marks:5,ao:"AO1",section:"Epistemology",topic:"Perception as a source of knowledge",tags:["Perception as a source of knowledge"],question:"Explain how Berkeley's idealism differs from indirect realism.",cap:"",content:["Berkeley's idealism is an anti-realist theory because it denies the existence of mind-independent physical objects, whereas indirect realism is a realist theory of perception because it affirms the existence of mind-independent physical objects.","This is because Berkeley sees the claim that there are mind-independent physical objects as having no explanatory value and as being incoherent. (Indirect realists disagree).","Berkeley's idealism is a direct theory of perception because it states that we directly perceive objects (and their properties), these being collections of mind-dependent ideas; whereas indirect realism is an indirect theory of perception because it states that we perceive physical objects (in the external world) indirectly, via mind-dependent representations of/caused by them (sense-data).","God plays a role in Berkeley's idealism which God does not (generally) play in indirect realism.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"4",marks:12,ao:"AO1",section:"Epistemology",topic:"Sources of knowledge",tags:["Sources of knowledge"],question:"Explain how Descartes argues that we can gain a priori knowledge through intuition and deduction.",cap:"",parts:["Intuition and a priori knowledge","Deduction and a priori knowledge"],content:["A priori knowledge \u2013 knowledge that is justified independent of experience (other than any experiences required to understand the proposition that is known).","Gaining a priori knowledge through intuition: Intuition is not a 'gut feeling' or 'instinct' but is an intellectual capacity to grasp the truth of a proposition directly and non-inferentially. (Descartes speaks of the 'natural light of reason' and 'clear and distinct ideas').","Descartes' claim that 'I exist' is knowledge gained through intuition.","Some students may give alternative examples of intuitions and this is fine. Descartes himself discusses the concept of God and mathematical and geometric truths.","Gaining a priori knowledge through deduction: Successful deduction as the drawing of conclusions that necessarily follow from the premises, ie deductively valid arguments.","There are several examples of deductions from Descartes that students may use: that God exists (via the ontological, trademark and cosmological arguments) and is no deceiver; that mind and body are distinct substances (via the conceivability and divisibility arguments); that there is a world of physical objects external to mind (via his awareness that his perceptions of such a world are involuntary and God exists and is no deceiver).","(In their examples of deductions, students might suggest that Descartes deduces that the essence of mind is thought. Whilst this is more likely to be an elaboration of the concept 'I', do not penalise students who make this point. They may also suggest that he deduces that the essence of a material body is extension).","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"5",marks:25,ao:"AO2",section:"Epistemology",topic:"Definition of knowledge",tags:["Definition of knowledge"],question:"How should propositional knowledge be defined?",cap:"",content:["Students should respond in the form of an argument, to a clear conclusion. They might argue: that knowledge should be defined in any of a variety of ways \u2013 eg Justified True Belief (JTB), Infallibilism, JTB with no false lemmas, Reliabilism, Epistemic virtue theory; for a particular definition either because that definition is inherently plausible, or because it addresses issues with another definition, or both; that knowledge cannot be defined; that there is no good definition available at the moment.","In their evaluation, students can gain credit for making reference to ways of generating philosophical definitions (Zagzebski).","Knowledge as justified true belief: Tripartite definition of knowledge: 'S knows that p' iff: S is justified in believing that p, p is true and S believes that p. Arguments in favour of the tripartite view, such as why each condition was thought to be necessary and why each of the three conditions were thought to be jointly sufficient. Arguments against the tripartite view, such as problems with each condition being necessary (ie knowledge without belief, knowledge without truth, knowledge without justification) and problems with the conditions being sufficient: Gettier-style counter examples.","Alternative definitions of knowledge: such as: JTB with 'no false lemmas': adding a requirement to JTB that you do not infer your belief from anything false. Arguments for JTB with no false lemmas, such as that it deals with Gettier's examples. Arguments against JTB with no false lemmas, such as the possibility of constructing examples of JTB with no false lemmas which do not count as knowledge.","Infallibilism: replacing 'justification' with a requirement for certainty (Students might present this in terms of clarification of the meaning of 'justification' rather than replacement). Arguments for infallibilism, such as the possibility that they avoid Gettier-style problems and the (intuitive) link between knowledge and certainty/not being able to be wrong. Arguments against infallibilism, such as the possibility that it goes too far and we could end up able to make almost no knowledge claims, leading to scepticism.","Reliabilism: belief + truth + a reliable method. Arguments for reliabilism, such as it being implausible to claim that we need justification for all knowledge claims, or that our knowledge claims do need to be based on absolute certainty; it allows children/animals/those incapable of reasoning to have some knowledge. Arguments against reliabilism, such as the difficulty in formulating a clear notion of 'reliable', and the problem of individuating methods.","Virtue epistemology: S's true belief formed as a result of S's intellectual virtues operating in a suitable way/brought about by a virtuous disposition. Arguments for virtue epistemology, such as their success in dealing with Gettier's examples, because the beliefs there are true because of luck/coincidence, rather than intellectual virtue. Arguments against virtue epistemology, such as the possibility of constructing cases of beliefs which are true because of intellectual virtue, but those not counting as knowledge.","As the focus of this question is primarily AO2 do not penalise students for misattributing arguments.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"6",marks:3,ao:"AO1",section:"Moral philosophy",topic:"Virtue ethics",tags:["Virtue ethics"],question:"Briefly explain why Aristotle thinks that pleasure is not the only good.",cap:"",content:["Students might give a brief outline of the argument to which Aristotle is responding (from Eudoxus), though this is not a requirement and should not, in the absence of any reference to pleasure not being the only good, receive credit.","Eudoxus' argument: Every creature (as a matter of empirical fact) aims at pleasure. This indicates that pleasure is, for each creature, the good. What is good for all creatures is the good.","Aristotle's response: Pleasure is not the only thing we aim at (students might phrase this as 'pleasure is not our only end'). There are other things \u2013 such as knowing and being virtuous \u2013 which we do, as a matter of fact, seek out. We seek out these things even if they bring us no pleasure. The pleasure they bring us is not why we seek them. Therefore they are final ends (in themselves) and not means to pleasure. Therefore pleasure cannot be the only good.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"7",marks:5,ao:"AO1",section:"Moral philosophy",topic:"Meta-ethics",tags:["Meta-ethics"],question:"Explain why emotivism is a non-cognitivist theory of ethical language.",cap:"",content:["Non-cognitivists about ethical language claim that: Ethical statements do not (cannot) make, or at least do not (cannot) only make, descriptive claims about reality which are truth-apt (ie true or false / fact-stating). When people are making ethical utterances they are not (or are not merely) expressing beliefs.","(Note: Some students might explain that emotivists/non-cognitivists do not claim that there is never any descriptive content implied by moral utterances: eg 'It was wrong of Jim to hit his brother' implies that 'Jim hit his brother' is true; but the word 'wrong' adds no descriptive content to the utterance. Adding 'It was wrong' simply expresses moral disapproval, according to the emotivist.)","Emotivists make both of these claims above and add the following: Our moral judgements are (or at least involve) expressions of our emotions - so saying 'Murder is wrong' is like saying 'Murder..Boo!!'. 'X is right' might be seen as the equivalent of cheering and 'X is wrong' as the equivalent of booing (informally, the 'boo-hurrah' theory). So 'Stealing is wrong' means 'Stealing, boo!'. Ethical language expresses emotions or attitudes \u2013 'pro-attitude' or 'con-attitudes'. Moral statements are still meaningful but not (only) because they state facts \u2013 they instead have 'emotive meaning'.","NB: Emotivists do not think that moral judgements give a report on our emotions. So according to an emotivist, 'Murder is wrong' does not mean 'I do not like murder'. Those who do think this would be cognitivists.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"8",marks:5,ao:"AO1",section:"Moral philosophy",topic:"Virtue ethics",tags:["Virtue ethics"],question:"Explain the analogy drawn between virtues and skills within Aristotelian ethics.",cap:"",content:["The context of the skill analogy is Aristotle's account of how you acquire the moral virtues/become virtuous. He draws an analogy between acquiring a skill and becoming virtuous. No-one is born able to play the harp; rather, we have the capacity to play the harp. No-one is born virtuous; rather we have the capacity to become virtuous. We don't learn to play the harp and then play it. We learn by playing. We don't learn to be virtuous, then be virtuous. We become virtuous by doing virtuous actions. To become a harp player, we need to practise. We do this by playing until playing becomes a fixed disposition \u2013 so by habituation. To become a virtuous person, we need to practise. We do this by doing virtuous actions until being virtuous becomes a fixed disposition \u2013 so by habituation.","Students might give examples, such as becoming temperate by repeatedly refusing to indulge yourself, until it becomes easier for you not to indulge yourself and you start to find it pleasant, rather than painful.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"9",marks:12,ao:"AO1",section:"Moral philosophy",topic:"Kantian ethics",tags:["Kantian ethics"],question:"Explain how Kant's deontological ethics can be applied to the question of whether we should ever tell lies.",cap:"",parts:["Kant's theory: duty, the good will and the categorical imperative","Application of both formulations of the Categorical Imperative to lying"],content:["Kant argues that we have duties not to do certain things which are wrong in themselves and lying is one such thing.","Moral duties are categorical and not hypothetical, because they are your duty regardless of what you want and are not a means to a further end. This means that it is never morally permissible to lie, regardless of circumstances. Students may make reference to Kant's axe-murderer example.","Kant argues that moral duties, including this one, are discoverable by reason.","Only the good will is good without qualification and to have a good will is to do your duty because it is your duty (other motivations are irrelevant): eg, Kant's 'shopkeepers' example about overcharging his inexperienced customers.","Application of the 1st formulation of the Categorical Imperative to lying: 'Act only according to that maxim by which you can at the same time will that it should become a universal law.' A universalised maxim of lying is incoherent/inconceivable since if there was no default practice of truth-telling then no-one would believe any lie, so there could not (in fact) be lying. It leads to a contradiction in conception, and so not lying is a perfect (absolute) duty. It shows that when we lie, we in fact want to make an exception of ourselves (because that is the only way that our lie will succeed).","Application of 2nd formulation of Categorical Imperative to lying: 'Act in such a way that you always treat humanity, whether in your own person or in the person of any other, never simply as a means, but always at the same time as an end'. Lying to someone uses them merely as a means to an end, since it is not treating them with respect given that it undermines their power of making a rational choice themselves. People cannot consent to a way of acting when they are given no chance to do so. The victim of a lie cannot consent to being lied to because he doesn't know he is being lied to. It is a manipulation of someone (and their trusting nature) rather than a treatment of them as a rational subject.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"10",marks:25,ao:"AO2",section:"Moral philosophy",topic:"Utilitarianism",tags:["Utilitarianism"],question:"How convincing is utilitarianism as an account of what makes an action morally right?",cap:"",content:["Students should respond in the form of an argument, to a clear conclusion. They might argue: that utilitarianism is convincing as an account of what makes an action morally right; that utilitarianism is unconvincing as an account of what makes an action morally right.","Students who argue that utilitarianism is convincing largely because other approaches (eg Kantian deontological ethics) are unconvincing, or unconvincing because other approaches (eg Aristotelian virtue ethics) are more convincing, can only receive credit if this approach is used specifically to evaluate aspects of utilitarianism.","Students should demonstrate that they understand utilitarianism, generally and/or in its particular forms.","Utilitarians claim that actions are morally right or wrong based on their consequences/effects and identify the best action as being that action which maximises actual or expected utility.","Utility can be understood in different ways by utilitarians (eg pleasure, preference satisfaction); utilitarians may disagree about whose utility we are calculating; utilitarians may disagree about whether the focus should be on acts or rules.","Utilitarianism is convincing: Some may find it prima facie plausible to suppose that all that can ultimately matter morally is future pain and pleasure. It is the best account (or even the only satisfactory account) of moral realism (the only/best account of how moral properties can be mind-independent is if they are (reducible to) natural properties). It is, prima facie, a fair account, given that each is to count as one and no-one for more than one. A maximising argument - that, if something is good, then (presumably) the more of it we have, the better \u2013 can be applied to happiness, pleasure, (preference satisfaction etc).","Utilitarianism is unconvincing: Fairness and individual liberty/rights (including the risk of tyranny of the majority). Whether utilitarianism ignores both the moral integrity and the intentions of the individual. Utilitarianism is too demanding on us \u2013 it requires us to do \u201csupererogatory\u201d acts (acts which are praiseworthy but not obligatory). Whether pleasure is the only good (Nozick's experience machine). Utilitarianism might demonstrate that the 'right' thing to do is something that we find deeply counter-intuitive, morally speaking. Students may discuss issues facing utilitarianism insofar as it is a variety of ethical naturalism: eg, the is-ought problem; the naturalistic fallacy; the open-question argument. Students may discuss issues facing utilitarianism insofar as it is a variety of moral realism: eg, how do we come to recognise moral properties as part of the natural world?, why is there so much disagreement? etc. Problems with the process of calculation (including which beings to include and issues around partiality): Utilitarianism ignores the possible moral status of particular relationships (family/friendship) we may have with others, and indeed ignores the special duty we may have to ourselves. Difficulties with predicting/knowing and/or measuring the relevant consequences. How much of the future can, or ought, the calculation take into account? Difficulties with making calculations quickly and accurately enough for the right decision to be made in time.","As the focus of this question is primarily AO2 do not penalise students for misattributing arguments.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]}
];

function getFiltered(){var out=[];for(var i=0;i<DATA.length;i++){var d=DATA[i];
if(sectionFilter!=="all"&&d.section!==sectionFilter)continue;
if(aoFilter!=="all"){var parts=aoFilter.split("-");if(d.ao!==parts[0]||String(d.marks)!==parts[1])continue;}
if(topicFilter!=="all"){var m=false;for(var t=0;t<d.tags.length;t++){if(stripTags(d.tags[t])===stripTags(topicFilter)){m=true;break;}}if(!m)continue;}
out.push(d);}
return out;}
function buildTopicButtons(){var h=document.getElementById("topic-buttons");var html="<button class='active' data-t='all' onclick=\"setTopicFilter('all', this)\">All</button>";
for(var i=0;i<TOPIC_BUTTONS.length;i++){var t=TOPIC_BUTTONS[i];html+="<button data-t='"+t+"' onclick=\"setTopicFilter('"+t+"', this)\">"+t+"</button>";}
h.innerHTML=html;}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function key(idx){return PAGEKEY+"-"+DATA[idx].qref;}
function attemptHtml(d,idx){var k=key(idx);var h="<div class='attempt'>";
if(d.marks===25){
h+="<div class='subsec'>Introduction</div>";
h+="<label>Outline the issue (AO1)</label><textarea id='"+k+"-i1'>"+(atext[k+"-i1"]||"")+"</textarea>";
h+="<label>Statement of intent</label><textarea id='"+k+"-i2'>"+(atext[k+"-i2"]||"")+"</textarea>";
h+="<label>Promise of weighting and balance</label><textarea id='"+k+"-i3'>"+(atext[k+"-i3"]||"")+"</textarea>";
h+="<div class='subsec'>Main body</div>";
for(var t=1;t<=4;t++){h+="<div class='threadgrid'>";
h+="<div><label>Argument "+t+"</label><textarea id='"+k+"-a"+t+"'>"+(atext[k+"-a"+t]||"")+"</textarea></div>";
h+="<div><label>But "+t+"</label><textarea id='"+k+"-b"+t+"'>"+(atext[k+"-b"+t]||"")+"</textarea></div>";
h+="<div><label>Conclusion "+t+"</label><textarea id='"+k+"-c"+t+"'>"+(atext[k+"-c"+t]||"")+"</textarea></div>";
h+="</div>";}
h+="<div class='subsec'>Conclusion</div>";
h+="<label>Final argument / synthesis</label><textarea id='"+k+"-f'>"+(atext[k+"-f"]||"")+"</textarea>";
}else if(d.marks===12&&d.parts){
for(var p=0;p<d.parts.length;p++){h+="<label>Part "+(p+1)+": "+esc(d.parts[p])+"</label><textarea id='"+k+"-p"+p+"'>"+(atext[k+"-p"+p]||"")+"</textarea>";}
}else{
h+="<label>Your answer</label><textarea id='"+k+"-x'>"+(atext[k+"-x"]||"")+"</textarea>";}
h+="<button onclick=\"revealMs('"+k+"',"+idx+")\">Submit and reveal mark scheme</button>";
h+="<button class='ghost' onclick=\"saveAttempt('"+k+"',"+idx+")\">Save attempt</button>";
h+="<div class='savednote' id='note-"+k+"'>"+(atext["shown-"+k]?"Mark scheme revealed. Attempts are saved in this browser.":"Attempt is saved in this browser.")+"</div>";
h+="</div>";return h;}
function levelsHtml(d){var L=d.marks===25?LEVELS_25:d.marks===12?LEVELS_12:d.marks===5?LEVELS_5:LEVELS_3;
var h="<div class='levels'>";for(var i=0;i<L.length;i++){h+="<p>"+L[i]+"</p>";}h+="</div>";return h;}
function msHtml(d){var h="<div class='ms'><h3>Mark scheme ("+(d.marks===25?"AO1 = 5, AO2 = 20":"AO1 = "+d.marks)+")</h3>";
h+=levelsHtml(d);
if(d.cap)h+="<div class='cap'>"+d.cap+"</div>";
for(var i=0;i<d.content.length;i++){h+="<p>"+d.content[i]+"</p>";}
h+="<h3>Source</h3><p>AQA 7172/1 specimen mark scheme, SAMs 1.0.</p></div>";return h;}
function render(){var q=document.getElementById("qlist");q.innerHTML="";var rows=getFiltered();
if(rows.length===0){q.innerHTML="<p class='empty'>No questions match the selected filters.</p>";return;}
for(var i=0;i<rows.length;i++){var d=rows[i];var idx=DATA.indexOf(d);var k=key(idx);
var card=document.createElement("div");card.className="qcard";
var html="<div class='qhead'><span class='qref'>Q"+d.qref+"</span><span class='badge "+(d.ao==="AO1"?"b-ao1":"b-ao2")+"'>"+d.ao+" &bull; "+d.marks+" marks</span><span class='topic'>"+d.section+" &bull; "+d.topic+"</span></div>";
html+="<div class='qtext'>"+d.question+"</div>";
html+="<button onclick=\"toggleDetail("+idx+")\">"+(expanded[idx]?"Hide":"Open answer space and mark scheme")+"</button>";
if(expanded[idx]){html+="<div class='detail'>";
html+="<div class='d-label'>AO target</div><p>"+(d.marks===25?"AO1 = 5, AO2 = 20 (25 marks). 25-mark questions are labelled AO2 as the dominant objective.":"AO1 = "+d.marks+" ("+d.marks+" marks).")+"</p>";
html+="<div class='d-label'>Your answer</div>"+attemptHtml(d,idx);
if(atext["shown-"+k]){html+="<div class='d-label'>Mark scheme</div>"+msHtml(d);}
html+="</div>";}
card.innerHTML=html;q.appendChild(card);}}
function toggleDetail(idx){if(expanded[idx]){delete expanded[idx];}else{expanded[idx]=true;}render();}
function setActive(h,b){var bs=document.querySelectorAll("#"+h+" button");for(var i=0;i<bs.length;i++)bs[i].classList.remove("active");b.classList.add("active");}
function setSectionFilter(f,b){sectionFilter=f;setActive("section-buttons",b);render();}
function setTopicFilter(f,b){topicFilter=f;setActive("topic-buttons",b);render();}
function setAoFilter(f,b){aoFilter=f;setActive("ao-buttons",b);render();}
function collectAttempt(k,idx){var d=DATA[idx];
if(d.marks===25){var ids=["i1","i2","i3","a1","b1","c1","a2","b2","c2","a3","b3","c3","a4","b4","c4","f"];
for(var i=0;i<ids.length;i++){var el=document.getElementById(k+"-"+ids[i]);if(el)atext[k+"-"+ids[i]]=el.value;}}
else if(d.marks===12&&d.parts){for(var p=0;p<d.parts.length;p++){var el2=document.getElementById(k+"-p"+p);if(el2)atext[k+"-p"+p]=el2.value;}}
else{var el3=document.getElementById(k+"-x");if(el3)atext[k+"-x"]=el3.value;}}
function saveAttempt(k,idx){collectAttempt(k,idx);try{localStorage.setItem("aqabank",JSON.stringify(atext));}catch(e){}
document.getElementById("note-"+k).textContent="Attempt saved in this browser.";}
function revealMs(k,idx){collectAttempt(k,idx);atext["shown-"+k]=true;try{localStorage.setItem("aqabank",JSON.stringify(atext));}catch(e){}
render();}
try{var saved=localStorage.getItem("aqabank");if(saved)atext=JSON.parse(saved);}catch(e){}
buildTopicButtons();
render();
</script>
</body>
</html>
