var LEVELS_3 = ["3 A full and correct answer, given precisely, with little or no redundancy.","2 The substantive content of the answer is correct, but there may be some redundancy or minor imprecision.","1 Relevant, but fragmented, points.","0 Nothing written worthy of credit."];
var LEVELS_5 = ["5 A full, clear and precise explanation. The student makes logical links between precisely identified points, with no redundancy.","4 A clear explanation, with logical links, but some imprecision/redundancy.","3 The substantive content of the explanation is present and there is an attempt at logical linking, but the explanation is not full and/or precise.","2 One or two relevant points made, but not precisely. The logic is unclear.","1 Fragmented points, with no logical structure.","0 Nothing written worthy of credit."];
var LEVELS_12 = ["10\u201312 The answer is set out in a precise, fully-integrated and logical form. The content is correct and demonstrates detailed understanding. Points are made clearly and precisely. Relevance is sustained, with very little or no redundancy. Philosophical language is used precisely throughout.","7\u20139 The answer is set out in a clear, integrated and logical form. The content of the answer is correct and demonstrates detailed understanding. The content is clearly relevant and points are made clearly and precisely. Any lack of clarity with respect to particular points is not sufficient to detract from the answer. Relevance is largely sustained. There may be some redundancy, though not sufficient to detract from the answer. Philosophical language is used correctly throughout.","4\u20136 The answer is clear and set out in a coherent form, with logical/causal links identified. The content of the answer is largely correct and most points are made clearly. Relevance is not always sustained and there is some redundancy. Philosophical language is used correctly, with any minor errors not detracting from the response.","1\u20133 There are some relevant points made, but no integration. Some points are clear, but there is a lack of precision \u2013 with possibly insufficient material that is relevant or too much that is irrelevant. Philosophical language is used, though not always consistently or appropriately.","0 Nothing written worthy of credit."];
var LEVELS_25 = ["21\u201325 The student argues with clear intent throughout and the logic of the argument is sustained. The student demonstrates detailed and precise understanding throughout. The conclusion is clear, with the arguments in support of it stated precisely, integrated coherently and robustly defended. Arguments and counter-arguments are stated in their strongest forms. Reasoned judgements are made, on an ongoing basis and overall, about the weight to be given to each argument. Crucial arguments are clearly identified against less crucial ones. Philosophical language is used precisely throughout.","16\u201320 The student argues with clear intent throughout and the logic of the argument is largely sustained. The content is correct and detailed \u2013 though not always consistently. The conclusion is clear, with a range of appropriate arguments supporting it. Arguments are generally stated in their strongest forms. There is a balancing of arguments, with weight being given to each \u2013 so crucial arguments are noted against less crucial ones. Arguments and counter-arguments are stated clearly, integrated coherently and defended. There may be trivial mistakes, as long as they do not detract from the argument. Philosophical language is used correctly throughout.","11\u201315 A clear response to the question, in the form of an argument, demonstrating intent. The content is detailed and correct and most of it is integrated. A conclusion and reasons are given and those reasons clearly support the conclusion. There might be a lack of clarity/precision about the logic of the argument as a whole. Arguments and counter-arguments are given, but there may be a lack of balance. Not all arguments are stated in their strongest forms. Stronger and weaker arguments are noted and there are attempts to identify the weight to be given to different arguments, but not necessarily those which are crucial to the conclusion. Philosophical language is used correctly, with any minor errors not detracting from the argument.","6\u201310 The response to the question is given in the form of an argument, but not fully coherently. The content is largely correct, though there are some gaps and a lack of detail. Relevant points are recognised/identified, but not integrated. Alternative positions are identified, but not precisely. Counter-arguments might be stated in weak forms or even slightly misrepresented. Arguments and counter-arguments are juxtaposed, so similarities and contrasts identified, rather than their impact being clear. Philosophical language is used throughout, though not always fully correctly and/or consistently.","1\u20135 There is little evidence of an argument. There may be missing content, substantial gaps in the content or the content may be one-sided. There may be a conclusion and several reasonable points may be made. There may be some connections between the points, but there is no clear relationship between the points and the conclusion. There is some basic use of philosophical language.","0 Nothing written worthy of credit."];

var DATA = [
{qref:"1",marks:3,ao:"AO1",section:"Metaphysics of God",topic:"Attributes of God",tags:["Attributes of God"],question:"Explain the difference between the claims 'God is eternal' and 'God is everlasting'.",cap:"No more than 1 mark for an answer which addresses only one of eternal/everlasting, as there is no attempt to explain the 'difference.'",content:["To say that God is eternal means that God exists outside time. He is timeless or atemporal. God has no beginning/end, since these make sense only in time (something starts/stops existing in time).","To say that God is everlasting means that God exists in time. He exists throughout all time with no beginning or end.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"2",marks:5,ao:"AO1",section:"Metaphysics of God",topic:"The problem of evil",tags:["The problem of evil"],question:"Explain the evidential problem of evil.",cap:"Credit should not be given for reference to the logical problem of evil alone.",content:["Students might refer to the evidential problem of evil as the 'inductive' problem of evil and/or the 'a posteriori' problem of evil. Students might make a contrast with the logical problem of evil, but there is no requirement to do so. If students do and if it helps to clarify what is meant by the evidential problem of evil, then they should receive credit.","The quantity (and quality and distribution) of evil/suffering, although logically consistent with the existence of an omnibenevolent (all-loving, all good) and omnipotent (all-powerful) God, counts against the existence of such a God by lowering the probability that such a God exists.","His being omnipotent (all-powerful) means that he has the capacity to reduce the amount of suffering and his being omnibenevolent (all-loving, all good) means that he has the desire to do so.","Such a God would want to and be able to (and therefore would) reduce the amount of suffering to the absolute minimum.","Students might add that his being omniscient (all-knowing) means that he is aware of the evils that exist.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"3",marks:5,ao:"AO1",section:"Metaphysics of God",topic:"The cosmological argument",tags:["The cosmological argument"],question:"Outline Aquinas' Third Way.",cap:"",content:["Students can articulate the argument in a number of ways. As long as the articulation is consistent with the Aquinas text (which is given below, for ease of reference), then credit should be given.","P1: Contingent beings exist in the universe. P2: If everything were contingent there would be a time when nothing existed. P3: If this were so, there would be nothing now as nothing comes from nothing. P4: Since contingent things do exist now (P1), there must be something that exists necessarily. C: Therefore there must be something that exists necessarily.","Students might continue this argument in the following way: P5: Every necessary thing either has its necessity caused by another or not. P6: An infinite regression of causes is impossible. C: There must be a necessary being (ie a being that has, of itself, its own necessity) and this all people call God.","Students might contextualise the argument, explaining that it is an a posteriori argument, in which Aquinas argues that the existence of contingent things in the universe is in need of explanation by a being that cannot be conceived not to exist. There is no requirement for them to do this but, if they do, this should not be counted as irrelevance or redundancy.","The Aquinas text: \u201cThe third way is taken from possibility and necessity, and runs thus. We find in nature things that are possible to be and not to be, since they are found to be generated, and to corrupt, and consequently, they are possible to be and not to be. But it is impossible for these always to exist, for that which is possible not to be at some time is not. Therefore, if everything is possible not to be, then at one time there could have been nothing in existence. Now if this were true, even now there would be nothing in existence, because that which does not exist only begins to exist by something already existing. Therefore, if at one time nothing was in existence, it would have been impossible for anything to have begun to exist; and thus even now nothing would be in existence \u2014 which is absurd. Therefore, not all beings are merely possible, but there must exist something the existence of which is necessary. But every necessary thing either has its necessity caused by another, or not. Now it is impossible to go on to infinity in necessary things which have their necessity caused by another, as has been already proved in regard to efficient causes. Therefore we cannot but postulate the existence of some being having of itself its own necessity, and not receiving it from another, but rather causing in others their necessity. This all men speak of as God.\u201d (Summa Theologica, part 2, art 3).","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"4",marks:12,ao:"AO1",section:"Metaphysics of God",topic:"The design argument",tags:["The design argument"],question:"Compare and contrast Paley's and Swinburne's versions of the design argument.",cap:"",parts:["Paley's version of the design argument","Swinburne's version of the design argument"],content:["Students do not need to set out either or both arguments, but, if they do so in such a way that they are identifying/clarifying similarities and differences, then credit should be given.","Both are empirical \u2013 identifying a feature of the world/universe. Paley: Spatial order (regularities of copresence). Parts put together (in a complex/intricate way) so that they can achieve a purpose eg the eye. Swinburne: Temporal order (regularities of succession governing how events occur over time) ie laws of nature.","Both then make an inference from those features. Paley: We explain human products which have this feature in terms of a designer. So we infer that the world has a designer. Swinburne: We need to explain these laws of nature and have two possibilities: scientific explanations and personal explanations. Scientific explanations presuppose fundamental laws, so we are left with a personal explanation \u2013 God.","Argument forms: the interpretation of Paley is philosophically contested, so please credit whichever (appropriate) reading the student takes. Paley: traditional reading (TR): an argument from analogy, which is inductive (broadly, ie abductive). Alternative reading (AR): not an analogy, but a deductive argument.","On either view, there seem to be two 'analogies': (a) watch vs. stone: their dissimilarity is the focus; (b) watch vs. universe: their similarity is the focus. The issue is over where to place (b) in the argument. TR: Paley (i) identifies design-like-features (DLFs) in artefacts; (ii) argues that they can only come to exist through intelligent design; and (iii) says that natural phenomena are analogous DLF-wise, thus enabling us (iv) to conclude that there is an analogous designer. AR: Paley (i) identifies design-like-features (DLFs) in artefacts; (ii) argues that they can only come to exist through intelligent design; then (iii) argues that exactly the same kind of DLFs are to be found in nature, thus enabling us (iv) to conclude that there is an intelligent designer.","The difference is that, in the first case, the watch is directly involved: similarities between it and eyes are at issue; whereas in (ii) the watch is indirectly involved: it is used to establish the existence of a certain kind of property \u2013 one which reflects intelligent designer, and thereafter the argument focuses just on how often this property is found in nature.","Swinburne: His argument makes use of (a) an argument to the best explanation (personal explanation over no explanation, having eliminated the scientific explanation) which is further supported by (b) an analogy between temporal regularities like 'the notes of a song sung by a singer' on the one hand and the laws of nature on the other. Both (a) and (b) are needed.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"5",marks:25,ao:"AO2",section:"Metaphysics of God",topic:"Religious language",tags:["Religious language"],question:"Is religious language meaningful?",cap:"",content:["Students should respond in the form of an argument, to a clear conclusion. They might argue: Yes \u2013 religious language is meaningful; No \u2013 religious language is not meaningful; Or possibly a more nuanced response, such as 'Some religious language is and some is not meaningful' or 'It depends what you mean by meaningful ...'.","Verificationists/Logical Positivists (such as Ayer): The Verification principle, either the weak or the strong form (as distinguished by Ayer); a proposition is only meaningful if either: (1) analytic: conceptual, tautological, logical. Or (2a) its probable truth could be empirically verified potentially/in principle (the weak version) or (2b) its truth could be conclusively empirically verified actually/in practice (strong version).","Applying this to religious language, some have argued that religious claims such as 'God loves me' and 'God answers my prayers' would not be meaningful given that they do not meet either of the conditions above.","Hick: religious language is meaningful. This is because religious claims are verifiable \u2013 they meet the requirements of the verification principle - but only eschatologically. But this might depend on the strength of the argument that eschatological verification is possible. Is the argument for continued post-mortem survival plausible? What if post-mortem experience is ambiguous with respect to the claims subject to verification?","Flew: religious language is not meaningful. Wisdom's parable of the gardener shows that the religious believer will not accept anything as falsifying their utterance. Rather than accept that their claims are false, the believer simply qualifies their claim \u2013 'Death by a thousand qualifications.'","Hare: religious language is meaningful, but not as assertions/claims about matters of fact, so the requirements of the verification principle do not need to be met. Bliks and the lunatic analogy \u2013 religious utterances do not assert propositions, but particular world-views/ways of seeing the world. As such, they are not the kinds of things which can be verified/falsified, because they determine what will (and will not) count as evidence.","Mitchell: religious language can be interpreted as making claims that are verifiable given what Mitchell regards as a broader and better understanding of what constitutes verification. In the Parable of the Partisan Mitchell suggests that religious believers will allow falsification since they accept that there is evidence which counts against their claim, but not decisively/conclusively.","Students can also receive credit for reference to other approaches to religious language, such as: the via negativa (eg Pseudo-Dionysius and the apophatic tradition); analogy (eg Aquinas); myth/symbol (eg Bultmann, Smart, Tillich); other non-cognitive views (eg Wittgenstein, Braithwaite, DZ Phillips); our having innate ideas of God permitting us to talk meaningfully about him, despite him being beyond experience (eg Descartes).","As the focus of this question is primarily AO2 do not penalise students for misattributing arguments.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"6",marks:3,ao:"AO1",section:"Metaphysics of mind",topic:"Eliminative materialism",tags:["Eliminative materialism"],question:"What do eliminative materialists claim about mental states?",cap:"",content:["Some or all of those mental states (phenomena, properties, processes) that are supposed to exist according to a common-sense or folk-psychological theory of the mind do not exist.","Some or all statements (claims, beliefs) about mental states (phenomena, properties, processes) are false given that the common-sense or folk-psychological theory of the mind is radically mistaken.","Some students may, in addition, add that what we ought to talk about instead are physical/physiological states or states defined by scientific rather than folk psychology.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"7",marks:5,ao:"AO1",section:"Metaphysics of mind",topic:"Substance dualism",tags:["Substance dualism"],question:"Outline Descartes' conceivability argument for substance dualism.",cap:"",content:["This is an argument for substance dualism: the view that there are non-physical/mental substances in addition to physical substances (that minds exist and are not identical to bodies or to parts of bodies).","The argument might be stated as: (P1) I can conceive of my mind existing without my extended physical body (and indeed the whole physical world) existing. (P2) Anything that I can ('clearly and distinctly') conceive of is (metaphysically) possible (Descartes puts this as: \u201cGod could make it so\u201d). (C1) Therefore, my mind existing without my extended physical body (and indeed the whole physical world) is (metaphysically) possible. (P3) If it is (metaphysically) possible for X to exist without Y then X is not identical to Y. (C) Therefore, my mind is not identical with my extended physical body (nor is it identical with any part of the physical world).","Students might present the argument in terms of clear and distinct ideas (ie I have a clear and distinct idea of mind and body as having distinct essences and thereby as being distinct substances, and, therefore, they are distinct substances).","P1 is linked to the cogito and the fact that Descartes can doubt the existence of physical reality, but not the existence of his mind. It is a deductive and (arguably) a priori argument. Students may phrase the argument in terms of what God can do or not (see P2).","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"8",marks:5,ao:"AO1",section:"Metaphysics of mind",topic:"Functionalism",tags:["Functionalism"],question:"Explain how Block's China thought experiment can be used to argue against functionalism.",cap:"",content:["Functionalists claim that if two things are functionally identical (they have all the same functional properties) then they must be mentally identical (they must have all the same mental properties).","The China thought experiment aims to show that something that is functionally identical to a human mind/brain can lack qualia. This means that functionalism cannot account for / explain qualia (phenomenal properties cannot be explained in terms of (reduced to) functional properties).","Block explains his thought-experiment as follows: \u201cSuppose we convert the government of China to functionalism, and we convince its officials to realize a human mind for an hour. We provide each of the billion people in China (I chose China because it has a billion inhabitants) with a specially designed two-way radio that connects them in the appropriate way to other persons and to the artificial body mentioned in the previous example. We replace each of the little men with a citizen of China plus his radio. Instead of a bulletin board, we arrange to have letters displayed on a series of satellites placed so that they can be seen from anywhere in China... The system of a billion people communicating with one another plus satellites plays the role of an external \u201cbrain\u201d connected to the artificial body by radio... It is not at all obvious that the China-body system is physically impossible. It could be functionally equivalent to you for a short time, say an hour.\u201d (from 'Troubles with Functionalism').","This objection from Block is sometimes known as the absent qualia objection and it might be phrased in terms of the conceivability / possibility of creatures that are functionally identical to humans, but lack qualia. It is better put in terms of 'qualia' than 'mind'/'consciousness' (given that people mean various things by mind/consciousness; things that might be less controversially achievable by the Chinese 'mind').","Should students decide to set it out more formally, they might argue: P1: Consideration of the China thought experiment shows that it is possible for two functional duplicates to differ mentally such that one (the human) has qualia while the other (the population of China) does not. P2: If it is possible for two functional duplicates to differ mentally such that one has qualia and the other does not then functionalism is false. C: Therefore functionalism is false. This argument could be put deductively in terms of logical possibility, or inductively in terms of the scenario being most likely physically possible.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"9",marks:12,ao:"AO1",section:"Metaphysics of mind",topic:"Mind-brain type identity theory",tags:["Mind-brain type identity theory"],question:"Outline mind-brain type identity theory and explain how the issue of multiple realisability challenges this view.",cap:"",parts:["Mind-brain type identity theory","The challenge from multiple realisability"],content:["Mind-brain type identity theory claims that mental states/properties are ontologically reducible to (identical to) physical/neural states/properties, but statements about mental states/properties are not equivalent in meaning to any statements about physical/neural states/properties (it is not an analytic reduction).","Students may explain this using analogies such as the morning star and evening star, or Clark Kent and Superman. They may make reference to the Frege sense-reference distinction (\u201cpain\u201d and \u201cneural state X\u201d may have the same reference but a different sense).","This theory says that there is type identity (ie a particular type of mental state (A) is identical to a particular type of neural state (Y)). This means that all people who are in (A) are, ipso facto, in (Y) \u2013 this is a denial of multiple realisability.","Multiple realisability challenges the type part of type identity theory: The issue may be put in terms of actual empirical evidence or hypothetical/conceivable scenarios (or both).","Empirical: Evidence suggests that people can have the same type of mental state without having the same type of neural state. No two people's brains are sufficiently similar. It also seems likely that animals might share some types of mental state with humans without having a sufficiently similar neural anatomy.","Hypothetical: (1) We can imagine creatures as yet unknown (aliens) who might have a mental state (eg pain) but have a completely different physical constitution to us; (2) The same goes for computers and robots that may be able to think, remember etc without having any organic matter at all.","It can be set out as follows in argument form, though this is not required: P1: Each type of mental state is multiply realizable through more than one distinct type of physical state. P2: If each type of mental state is multiply realizable through more than one distinct type of physical state, then it cannot be identical to any specific type of physical state. C1: Therefore, no type of mental state is identical to any specific type of physical state. P3: According to type identity theory, each type of mental state is identical to a specific type of physical state. C2: Therefore, type identity theory is false.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]},
{qref:"10",marks:25,ao:"AO2",section:"Metaphysics of mind",topic:"Behaviourism",tags:["Behaviourism"],question:"Does philosophical behaviourism give the correct account of mental states?",cap:"",content:["Students should respond in the form of an argument, to a clear conclusion. They might argue: that philosophical behaviourism does give the correct account of mental states; that philosophical behaviourism does not give the correct account of mental states.","Students might explain philosophical behaviourism in either or both of the following ways (and some may consider the relative merits of both formulations in the course of the essay): 'Hard' behaviourism: all propositions about mental states can be reduced without loss of meaning to propositions that exclusively use the language of physics to talk about bodily states/movements (eg Carl Hempel). 'Soft' behaviourism: propositions about mental states are propositions about behavioural dispositions (ie propositions that use ordinary language) (eg Gilbert Ryle). It is a physicalist account of the mind.","Philosophical behaviourism does give the correct account of mental states: Verificationism in support of philosophical behaviourism: in order for talk/communication about the mind to be meaningful, it needs to be empirically verifiable and must, therefore, describe events that are publically observable. This is what explains our ability to learn mental vocabulary. In this way, some see philosophical behaviourism as bypassing the 'problem of other minds' that faces other theories (notably dualism/s). As a materialist theory, philosophical behaviourism does not face any issues that arise from the interaction of the non-physical with the physical.","Philosophical behaviourism does not give the correct account of mental states: The distinctness of mind and behaviour: A 'conceivability' argument (analogous to the usual one) can be applied as an argument against philosophical behaviourism (if the mind were just behaviour then we would not be able to conceive of mind existing without behaviour), with issues including: mind without behaviour is not conceivable; what is conceivable may not be logically possible; what is logically possible tells us nothing about reality. A 'philosophical zombies' argument (analogous to the usual one) can be applied as an argument against philosophical behaviourism (if the mind were just behaviour then we would not be able to conceive of behaviour existing without mind), with issues including: a 'philosophical zombie' / a 'zombie' world is not conceivable; what is conceivable may not be logically possible; what is logically possible tells us nothing about reality. Hilary Putnam's 'Super-Spartans' and perfect actors.","Issues relating specifically to qualia: Qualia are defined by their intrinsic properties yet behaviourism analyses (away) mental states into relational properties (behavioural dispositions) and so fails to capture qualia. The 'inverted' qualia objection might be used in this context \u2013 ie the conceivability / possibility of behavioural duplicates that are qualia inverts.","Definitional problems: Philosophical behaviourists face an issue defining mental states satisfactorily due to circularity (be this 'general' circularity (mental states cannot be analysed without reference to other mental states) or 'specific' circularity (the definition of mental state A will require reference to other mental states as part of its analysis which, when themselves defined, will ultimately require reference to A)). Philosophical behaviourists face an issue defining mental states satisfactorily due to the multiple realisability of mental states in behaviour (there is no specific way that one acts when in pain, and there are many, arguably infinite, possibilities).","Causation: Philosophical behaviourism gives an inadequate account of mental causation (what answer can a behaviourist give to the question, \u201cWhy did he raise his hand?\u201d; \u201cHe wanted to ask a question and so raised his hand\u201d no longer describes a causal sequence).","Self-knowledge: The asymmetry between self-knowledge and knowledge of other people's mental states shows that philosophical behaviourism is false (philosophical behaviourism might even imply that I might sometimes know others' minds better than my own if I have a better view of their behaviour and its subtleties than I have of my own).","As the focus of this question is primarily AO2 do not penalise students for misattributing arguments.","Note: This indicative content is not exhaustive: other creditworthy responses should be awarded marks as appropriate."]}

var sectionFilter="all",topicFilter="all",aoFilter="all";
var expanded={};
var atext={};
var PAGEKEY="p2-sam19";
function stripTags(s){var d=document.createElement("div");d.innerHTML=s;return(d.textContent||"").toLowerCase();}
function getFiltered(){var out=[];for(var i=0;i<DATA.length;i++){var d=DATA[i];
if(sectionFilter!=="all"&&d.section!==sectionFilter)continue;
if(aoFilter!=="all"){var parts=aoFilter.split("-");if(d.ao!==parts[0]||String(d.marks)!==parts[1])continue;}
if(topicFilter!=="all"){var m=false;for(var t=0;t<d.tags.length;t++){if(stripTags(d.tags[t])===stripTags(topicFilter)){m=true;break;}}if(!m)continue;}
out.push(d);}
return out;}
function buildTopicButtons(){var h=document.getElementById("topic-buttons");var html="<button class='active' data-t='all' onclick=\"setTopicFilter('all', this)\">All</button>";
for(var i=0;i<TOPIC_BUTTONS.length;i++){var t=TOPIC_BUTTONS[i];html+="<button data-t='"+t+"' onclick=\"setTopicFilter('"+t+"', this)\">"+t+"</button>";}
h.innerHTML=html;}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function key(idx){return PAGEKEY+"-"+DATA[idx].qref;}
function attemptHtml(d,idx){var k=key(idx);var h="<div class='attempt'>";
if(d.marks===25){
h+="<div class='subsec'>Introduction</div>";
h+="<label>Outline the issue (AO1)</label><textarea id='"+k+"-i1'>"+(atext[k+"-i1"]||"")+"</textarea>";
h+="<label>Statement of intent</label><textarea id='"+k+"-i2'>"+(atext[k+"-i2"]||"")+"</textarea>";
h+="<label>Promise of weighting and balance</label><textarea id='"+k+"-i3'>"+(atext[k+"-i3"]||"")+"</textarea>";
h+="<div class='subsec'>Main body</div>";
for(var t=1;t<=4;t++){h+="<div class='threadgrid'>";
h+="<div><label>Argument "+t+"</label><textarea id='"+k+"-a"+t+"'>"+(atext[k+"-a"+t]||"")+"</textarea></div>";
h+="<div><label>But "+t+"</label><textarea id='"+k+"-b"+t+"'>"+(atext[k+"-b"+t]||"")+"</textarea></div>";
h+="<div><label>Conclusion "+t+"</label><textarea id='"+k+"-c"+t+"'>"+(atext[k+"-c"+t]||"")+"</textarea></div>";
h+="</div>";}
h+="<div class='subsec'>Conclusion</div>";
h+="<label>Final argument / synthesis</label><textarea id='"+k+"-f'>"+(atext[k+"-f"]||"")+"</textarea>";
}else if(d.marks===12&&d.parts){
for(var p=0;p<d.parts.length;p++){h+="<label>Part "+(p+1)+": "+esc(d.parts[p])+"</label><textarea id='"+k+"-p"+p+"'>"+(atext[k+"-p"+p]||"")+"</textarea>";}
}else{
h+="<label>Your answer</label><textarea id='"+k+"-x'>"+(atext[k+"-x"]||"")+"</textarea>";}
h+="<button onclick=\"revealMs('"+k+"',"+idx+")\">Submit and reveal mark scheme</button>";
h+="<button class='ghost' onclick=\"saveAttempt('"+k+"',"+idx+")\">Save attempt</button>";
h+="<div class='savednote' id='note-"+k+"'>"+(atext["shown-"+k]?"Mark scheme revealed. Attempts are saved in this browser.":"Attempt is saved in this browser.")+"</div>";
h+="</div>";return h;}
function levelsHtml(d){var L=d.marks===25?LEVELS_25:d.marks===12?LEVELS_12:d.marks===5?LEVELS_5:LEVELS_3;
var h="<div class='levels'>";for(var i=0;i<L.length;i++){h+="<p>"+L[i]+"</p>";}h+="</div>";return h;}
function msHtml(d){var h="<div class='ms'><h3>Mark scheme ("+(d.marks===25?"AO1 = 5, AO2 = 20":"AO1 = "+d.marks)+")</h3>";
h+=levelsHtml(d);
if(d.cap)h+="<div class='cap'>"+d.cap+"</div>";
for(var i=0;i<d.content.length;i++){h+="<p>"+d.content[i]+"</p>";}
h+="<h3>Source</h3><p>AQA 7172/2 specimen mark scheme, SAMs 1.0.</p></div>";return h;}
function render(){var q=document.getElementById("qlist");q.innerHTML="";var rows=getFiltered();
if(rows.length===0){q.innerHTML="<p class='empty'>No questions match the selected filters.</p>";return;}
for(var i=0;i<rows.length;i++){var d=rows[i];var idx=DATA.indexOf(d);var k=key(idx);
var card=document.createElement("div");card.className="qcard";
var html="<div class='qhead'><span class='qref'>Q"+d.qref+"</span><span class='badge "+(d.ao==="AO1"?"b-ao1":"b-ao2")+"'>"+d.ao+" &bull; "+d.marks+" marks</span><span class='topic'>"+d.section+" &bull; "+d.topic+"</span></div>";
html+="<div class='qtext'>"+d.question+"</div>";
html+="<button onclick=\"toggleDetail("+idx+")\">"+(expanded[idx]?"Hide":"Open answer space and mark scheme")+"</button>";
if(expanded[idx]){html+="<div class='detail'>";
html+="<div class='d-label'>AO target</div><p>"+(d.marks===25?"AO1 = 5, AO2 = 20 (25 marks). 25-mark questions are labelled AO2 as the dominant objective.":"AO1 = "+d.marks+" ("+d.marks+" marks).")+"</p>";
html+="<div class='d-label'>Your answer</div>"+attemptHtml(d,idx);
if(atext["shown-"+k]){html+="<div class='d-label'>Mark scheme</div>"+msHtml(d);}
html+="</div>";}
card.innerHTML=html;q.appendChild(card);}}
function toggleDetail(idx){if(expanded[idx]){delete expanded[idx];}else{expanded[idx]=true;}render();}
function setActive(h,b){var bs=document.querySelectorAll("#"+h+" button");for(var i=0;i<bs.length;i++)bs[i].classList.remove("active");b.classList.add("active");}
function setSectionFilter(f,b){sectionFilter=f;setActive("section-buttons",b);render();}
function setTopicFilter(f,b){topicFilter=f;setActive("topic-buttons",b);render();}
function setAoFilter(f,b){aoFilter=f;setActive("ao-buttons",b);render();}
function collectAttempt(k,idx){var d=DATA[idx];
if(d.marks===25){var ids=["i1","i2","i3","a1","b1","c1","a2","b2","c2","a3","b3","c3","a4","b4","c4","f"];
for(var i=0;i<ids.length;i++){var el=document.getElementById(k+"-"+ids[i]);if(el)atext[k+"-"+ids[i]]=el.value;}}
else if(d.marks===12&&d.parts){for(var p=0;p<d.parts.length;p++){var el2=document.getElementById(k+"-p"+p);if(el2)atext[k+"-p"+p]=el2.value;}}
else{var el3=document.getElementById(k+"-x");if(el3)atext[k+"-x"]=el3.value;}}
function saveAttempt(k,idx){collectAttempt(k,idx);try{localStorage.setItem("aqabank",JSON.stringify(atext));}catch(e){}
document.getElementById("note-"+k).textContent="Attempt saved in this browser.";}
function revealMs(k,idx){collectAttempt(k,idx);atext["shown-"+k]=true;try{localStorage.setItem("aqabank",JSON.stringify(atext));}catch(e){}
render();}
try{var saved=localStorage.getItem("aqabank");if(saved)atext=JSON.parse(saved);}catch(e){}
buildTopicButtons();
render();
</script>
