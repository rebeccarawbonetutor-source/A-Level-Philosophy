<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Level Philosophy</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #94a3b8;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent-primary: #0369a1;
            --accent-header: #075985;
            --hover-bg: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: auto;
        }

        header {
            padding: 2.5rem 1rem 2rem;
            text-align: center;
            border-bottom: 1px solid #cbd5e1;
            background: #ffffff;
        }

        header h1 {
            font-size: 2.4rem;
            color: var(--accent-header);
            font-weight: 700;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            width: 100%;
            gap: 2.5rem;
        }

        .papers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2.5rem;
            width: 100%;
            max-width: 1000px;
        }

        .hub-card {
            background-color: var(--card-bg);
            border: 2px solid var(--card-border);
            border-top: 6px solid var(--accent-primary);
            border-radius: 12px;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            gap: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .hub-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-primary);
            box-shadow: 0 10px 20px -3px rgba(3, 105, 161, 0.15);
        }

        .hub-card h2 {
            font-size: 1.4rem;
            color: var(--accent-header);
            font-weight: 700;
        }

        .term-section {
            width: 100%;
            max-width: 1000px;
        }

        .term-card {
            background-color: var(--card-bg);
            border: 2px solid var(--card-border);
            border-top: 6px solid #0284c7;
            border-radius: 12px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .term-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px -3px rgba(3, 105, 161, 0.15);
        }

        .term-card h2 {
            font-size: 1.4rem;
            color: var(--accent-header);
            font-weight: 700;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-primary);
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            background-color: var(--accent-header);
        }

        .btn.disabled {
            background-color: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid #cbd5e1;
            background: #ffffff;
            margin-top: 3rem;
        }

        @media (max-width: 768px) {
            .papers-grid {
                grid-template-columns: 1fr;
                max-width: 600px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>A Level Philosophy</h1>
    </header>

    <div class="container">
        <!-- Four Main Paper Buttons Grid -->
        <div class="papers-grid">
            <div class="hub-card">
                <h2>Epistemology</h2>
                <a href="#" class="btn disabled">Coming soon</a>
            </div>

            <div class="hub-card">
                <h2>Moral philosophy</h2>
                <a href="#" class="btn disabled">Coming soon</a>
            </div>

            <div class="hub-card">
                <h2>Metaphysics of God</h2>
                <a href="#" class="btn disabled">Coming soon</a>
            </div>

            <div class="hub-card">
                <h2>Metaphysics of mind</h2>
                <a href="mind-hub.html" class="btn">View module</a>
            </div>
        </div>

        <!-- Terminology Flashcards Section -->
        <div class="term-section">
            <div class="term-card">
                <h2>Subject specific terminology - flashcards practice</h2>
                <a href="terminology.html" class="btn">Practice flashcards</a>
            </div>
        </div>
    </div>

    <footer>
        A Level Philosophy &bull; Revision Portal
    </footer>

</body>
</html>
