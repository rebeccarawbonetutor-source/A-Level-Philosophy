<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Level Philosophy</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #94a3b8;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent-primary: #0369a1;
            --accent-header: #075985;
            --hover-bg: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            padding: 2.5rem 1rem 1.5rem;
            text-align: center;
            border-bottom: 1px solid #cbd5e1;
            background: #ffffff;
        }

        header h1 {
            font-size: 2.8rem;
            color: var(--accent-header);
            font-weight: 700;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            width: 100%;
            gap: 2rem;
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            width: 100%;
            max-width: 800px;
        }

        .module-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-top: 5px solid var(--accent-primary);
            border-radius: 10px;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            color: var(--accent-header);
            text-align: center;
        }

        .module-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(3, 105, 161, 0.15);
        }

        .module-card h3 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .flashcard-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-top: 5px solid var(--accent-primary);
            border-radius: 10px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            color: var(--accent-header);
            text-align: center;
            width: 100%;
            max-width: 800px;
        }

        .flashcard-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(3, 105, 161, 0.15);
        }

        .flashcard-card h3 {
            font-size: 1.4rem;
            font-weight: 700;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid #cbd5e1;
            background: #ffffff;
        }

        @media (max-width: 768px) {
            .modules-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>A Level Philosophy</h1>
    </header>

    <div class="container">
        <div class="modules-grid">
            <a href="epistemology-hub.html" class="module-card">
                <h3>Epistemology</h3>
            </a>

            <a href="moral philosophy-hub.html" class="module-card">
                <h3>Moral Philosophy</h3>
            </a>

            <a href="God-hub.html" class="module-card">
                <h3>Metaphysics of God</h3>
            </a>

            <a href="mind-hub.html" class="module-card">
                <h3>Metaphysics of the Mind</h3>
            </a>
        </div>

        <a href="terminology.html" class="flashcard-card">
            <h3>Flashcards app (terminology)</h3>
        </a>

        <a href="past-questions-hub.html" class="flashcard-card">
            <h3>Past questions hub</h3>
        </a>

        <a href="25.html" class="flashcard-card">
            <h3>Essay planning</h3>
        </a>

        <a href="https://www.aqa.org.uk/subjects/philosophy/a-level/philosophy-7172/specification" target="_blank" rel="noopener noreferrer" class="flashcard-card">
            <h3>A Level Philosophy on the AQA website</h3>
        </a>
    </div>

</body>
</html>
